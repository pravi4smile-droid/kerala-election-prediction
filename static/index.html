    <p style="color:var(--muted);font-size:13px">Loading...</p></div>`;

  if (!roundLeadsCache) {
    try {
      const res = await fetch('/api/round_leads_matrix');
      if (!res.ok) throw new Error('failed');
      roundLeadsCache = await res.json();
    } catch (e) {
      area.innerHTML = `<div class="card"><div class="card-title">Round leads</div>
        <p style="color:var(--muted);font-size:13px">Round lead data is not available.</p></div>`;
      return;
    }
  }

  const data = roundLeadsCache;
  const mode = state.roundLeadsMode || 'cumulative';
  const isCumul = mode === 'cumulative';
  const maxRound = data.max_round || 0;
  const rounds = Array.from({length: maxRound}, (_, i) => i + 1);
  const parties = ['ldf', 'udf', 'nda'];

  // Build round-only tally using per-round delta leaders from backend
  function roundOnlyTally() {
    const t = {};
    rounds.forEach(r => { t[r] = {ldf:0, udf:0, nda:0, other:0}; });
    const src = data.delta_tally_by_round || {};
    rounds.forEach(r => {
      const entry = src[String(r)];
      if (entry) t[r] = {...t[r], ...entry};
    });
    return t;
  }

  const tallyByRound = isCumul
    ? Object.fromEntries(rounds.map(r => [r, data.tally_by_round?.[String(r)] || {}]))
    : roundOnlyTally();

  // ── Chart ────────────────────────────────────────────────────────────────
  const chartW = Math.max(760, maxRound * 42);
  const chartH = 240;
  const pad = { l: 42, r: 18, t: 16, b: 32 };
  const innerW = chartW - pad.l - pad.r;
  const innerH = chartH - pad.t - pad.b;
  const yMax = 140;
  const xFor = r => pad.l + ((r - 1) / Math.max(maxRound - 1, 1)) * innerW;
  const yFor = v => pad.t + innerH - (v / yMax) * innerH;

  let svg = `<div style="overflow-x:auto"><svg class="lead-chart" viewBox="0 0 ${chartW} ${chartH}" style="min-width:${chartW}px">`;
  [0, 35, 70, 105, 140].forEach(yv => {
    const y = yFor(yv);
    svg += `<line class="lead-chart-grid" x1="${pad.l}" y1="${y}" x2="${chartW - pad.r}" y2="${y}"></line>
      <text x="8" y="${y + 3}">${yv}</text>`;
  });
  rounds.forEach(r => {
    if (r === 1 || r === maxRound || r % 2 === 0) {
      svg += `<text x="${xFor(r) - 8}" y="${chartH - 10}">R${r}</text>`;
    }
  });
  parties.forEach(a => {
    const points = rounds.map(r => {
      const v = tallyByRound[r]?.[a] || 0;
      return `${xFor(r).toFixed(1)},${yFor(v).toFixed(1)}`;
    }).join(' ');
    svg += `<polyline class="lead-chart-line" stroke="${ALLIANCE_COLORS[a]}" points="${points}"></polyline>`;
    rounds.forEach(r => {
      const v = tallyByRound[r]?.[a] || 0;
      svg += `<circle class="lead-chart-point" cx="${xFor(r)}" cy="${yFor(v)}" r="3" fill="${ALLIANCE_COLORS[a]}">
        <title>R${r} ${ALLIANCE_LABELS[a]}: ${v}</title></circle>`;
    });
  });
  svg += `</svg></div>`;

  // ── Summary chips ─────────────────────────────────────────────────────────
  const lastTally = tallyByRound[maxRound] || {};
  const counted = (lastTally.ldf||0)+(lastTally.udf||0)+(lastTally.nda||0);
  const otherCount = isCumul ? Math.max(0, 140 - counted) : (lastTally.other||0);
  let summary = `<div class="lead-summary">`;
  parties.forEach(a => {
    summary += `<span class="score-chip"><span class="dot" style="background:${ALLIANCE_COLORS[a]}"></span>
      <span>${ALLIANCE_LABELS[a]}</span><span class="num">${lastTally[a] || 0}</span></span>`;
  });
  if (otherCount > 0) {
    summary += `<span class="score-chip"><span class="dot" style="background:${ALLIANCE_COLORS.ind}"></span>
      <span>IND</span><span class="num">${otherCount}</span></span>`;
  }
  const total = counted + otherCount;
  summary += `<span style="font-size:11px;color:var(--muted);align-self:center;margin-left:4px">
    ${isCumul ? `= ${total} seats at R${maxRound}` : `= ${total} constituencies active at R${maxRound}`}
  </span>`;
  summary += `</div>`;

  // ── Matrix ────────────────────────────────────────────────────────────────
  let table = `<div class="lead-matrix-wrap"><table class="lead-matrix"><thead><tr>
    <th class="const-head">Constituency</th>`;
  rounds.forEach(r => { table += `<th>R${r}</th>`; });
  table += `</tr></thead><tbody>`;

  (data.rows || []).forEach(row => {
    const byRound = {};
    (row.rounds || []).forEach(rr => { byRound[rr.round] = rr; });
    table += `<tr><td class="const-cell" onclick="openConst(${row.const_no})">
      <span style="font-family:var(--mono);color:var(--muted)">${String(row.const_no).padStart(3,'0')}</span>
      ${row.name}<span class="lead-district">${row.district || ''}</span>
    </td>`;
    rounds.forEach(r => {
      const rr = byRound[r];
      // Matrix always empty for carried rounds; carry-forward is for graph only
      if (!rr || rr.carried) {
        table += `<td class="lead-cell empty"></td>`;
        return;
      }
      const a = parties.includes(rr.alliance) ? rr.alliance : 'other';
      table += `<td class="lead-cell ${a}" title="${row.name} R${r}: ${rr.leader_name} (${rr.leader_party}) ${Number(rr.votes||0).toLocaleString()}">
        ${ALLIANCE_LABELS[a] || 'IND'}
      </td>`;
    });
    table += `</tr>`;
  });
  table += `</tbody></table></div>`;

  // ── Toggle ────────────────────────────────────────────────────────────────
  const toggle = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
    <span style="font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase">View</span>
    <button class="round-btn ${isCumul ? 'active' : ''}"
      onclick="state.roundLeadsMode='cumulative';renderRoundLeads()">Cumulative</button>
    <button class="round-btn ${!isCumul ? 'active' : ''}"
      onclick="state.roundLeadsMode='round_only';renderRoundLeads()">Round Only</button>
    <span style="font-size:11px;color:var(--muted);margin-left:6px">
      ${isCumul
        ? 'Seats leading after each cumulative round (carries forward when constituency finishes)'
        : 'Seats leading in each individual round only — matrix empty once constituency completes'
      }
    </span>
  </div>`;

  area.innerHTML = `<div class="card">
    <div class="card-title">Round-by-round leading alliance</div>
    ${toggle}
    ${svg}
    ${summary}
    ${table}
  </div>`;
}

//  Insights tab - statewide vote changes against historical baselines (LDF / UDF / NDA)
function renderInsights() {
  const preds = eciPredRaw?.predictions || {};
  const alliance = state.insightAlliance || 'ldf';
  const baseYear = state.ldfInsightYear || 2021;
  const sortKey = state.ldfInsightSort || 'pct_desc';
  const allianceLabel = ALLIANCE_LABELS[alliance] || alliance.toUpperCase();
  const allianceColor = ALLIANCE_COLORS[alliance] || ALLIANCE_COLORS.ldf;
  const allianceBg   = ALLIANCE_BG[alliance]    || ALLIANCE_BG.ldf;

  const pct = (part, total) => total > 0 ? part / total * 100 : null;
  const cleanName = name => (name || '-').replace(/^(ADV\.|DR\.|ADVOCATE|SHRI|SMT\.)\s*/i, '').trim().split(/\s+/).slice(-2).join(' ');
  const deltaColor = v => v == null ? 'var(--muted)' : v >= 0 ? '#16a34a' : '#dc2626';
  const voteDelta = v => v == null ? '-' : `${v >= 0 ? '+' : ''}${Math.round(v).toLocaleString()}`;
  const pctDelta  = v => v == null ? '-' : `${v >= 0 ? '+' : ''}${v.toFixed(1)} pp`;

  function yearVotes(c, year) {
    const key = `actual${year}`;
    const out = {};
    ['ldf', 'udf', 'nda'].forEach(a => out[a] = c.candidates.find(x => x.alliance === a)?.[key] || 0);
    out.total = out.ldf + out.udf + out.nda;
    return out;
  }
  const YEAR_LABELS = { 2021:'2021', 2016:'2016', 2011:'2011', '2019ls':'2019 LS', '2024ls':'2024 LS' };

  let rows = state.constituencies.map(c => {
    const pred = preds[String(c.no)];
    // Use actual2026 from candidate data (sums all alliance candidates) — not live_votes which can miss multi-candidate alliances
    const get2026 = a => c.candidates.find(x => x.alliance === a)?.actual2026 ?? 0;
    const votes26 = get2026(alliance);
    const total26  = get2026('ldf') + get2026('udf') + get2026('nda');
    const base = yearVotes(c, baseYear);
    const pct26  = pct(votes26, total26);
    const pctBase = pct(base[alliance], base.total);
    const ranked = ['ldf','udf','nda'].map(a=>({a,votes:get2026(a)})).sort((a,b)=>b.votes-a.votes);
    return {
      no: c.no, name: c.name, district: c.district,
      candName:  c.candidates.find(x => x.alliance === alliance)?.name || '',
      candParty: c.candidates.find(x => x.alliance === alliance)?.party || '',
      baseParty: c.candidates.find(x => x.alliance === alliance)?.[`party${baseYear}`] || '',
      votes26, votesBase: base[alliance], pct26, pctBase,
      voteChange: total26 > 0 && base.total > 0 ? votes26 - base[alliance] : null,
      pctChange:  pct26 != null && pctBase != null ? pct26 - pctBase : null,
      winnerAlliance: pred?.called_winner_alliance || pred?.winner_alliance || ranked[0]?.a,
      winnerName:     pred?.called_winner_name     || pred?.winner_name     || ALLIANCE_LABELS[ranked[0]?.a],
      hasData: total26 > 0 && base.total > 0,
    };
  }).filter(r => r.hasData);

  const sorters = {
    pct_desc:        (a,b) => (b.pctChange   ?? -999)       - (a.pctChange   ?? -999),
    pct_asc:         (a,b) => (a.pctChange   ?? 999)        - (b.pctChange   ?? 999),
    votes_desc:      (a,b) => (b.voteChange  ?? -999999999) - (a.voteChange  ?? -999999999),
    votes_asc:       (a,b) => (a.voteChange  ?? 999999999)  - (b.voteChange  ?? 999999999),
    share_desc:      (a,b) => (b.pct26       ?? 0)          - (a.pct26       ?? 0),
    votes_2026_desc: (a,b) => b.votes26 - a.votes26,
    number:          (a,b) => a.no - b.no,
  };
  rows.sort(sorters[sortKey] || sorters.pct_desc);

  const avg = key => rows.length ? rows.reduce((s,r)=>s+(r[key] ?? 0),0)/rows.length : null;
  const maxAbsPct      = Math.max(1, ...rows.map(r => Math.abs(r.pctChange || 0)));
  const totalVoteChange = rows.reduce((s,r)=>s+(r.voteChange || 0),0);
  const avgPctChange   = avg('pctChange');
  const gained = rows.filter(r => (r.pctChange || 0) > 0).length;
  const lost   = rows.filter(r => (r.pctChange || 0) < 0).length;

  const alliancePicker = ['ldf','udf','nda'].map(a => {
    const lbl = ALLIANCE_LABELS[a] || a.toUpperCase();
    const col  = ALLIANCE_COLORS[a];
    const isActive = a === alliance;
    const style = isActive ? '' : `border-color:${col};color:${col}`;
    return `<button class="round-btn ${isActive ? 'active' : ''}" style="${style}" onclick="state.insightAlliance='${a}';renderInsights()">${lbl}</button>`;
  }).join('');

  let html = `<div class="card" style="margin-bottom:14px;border-color:${allianceColor}44;background:${allianceBg}44">
    <div style="display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px">
      <div class="card-title" style="margin-bottom:0">${allianceLabel} vote change insights — ${YEAR_LABELS[baseYear]||baseYear} vs 2026</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase">Alliance</span>
        ${alliancePicker}
        <span style="font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-left:4px">vs</span>
        <button class="round-btn ${baseYear === 2021 ? 'active' : ''}" onclick="state.ldfInsightYear=2021;renderInsights()">2021</button>
        <button class="round-btn ${baseYear === 2016 ? 'active' : ''}" onclick="state.ldfInsightYear=2016;renderInsights()">2016</button>
        <button class="round-btn ${baseYear === 2011 ? 'active' : ''}" onclick="state.ldfInsightYear=2011;renderInsights()">2011</button>
        <button class="round-btn ${baseYear === '2019ls' ? 'active' : ''}" onclick="state.ldfInsightYear='2019ls';renderInsights()">2019 LS</button>
        <button class="round-btn ${baseYear === '2024ls' ? 'active' : ''}" onclick="state.ldfInsightYear='2024ls';renderInsights()">2024 LS</button>
        <select class="dist-select" style="width:auto;min-width:190px" onchange="state.ldfInsightSort=this.value;renderInsights()">
          <option value="pct_desc" ${sortKey==='pct_desc'?'selected':''}>Share gain high to low</option>
          <option value="pct_asc" ${sortKey==='pct_asc'?'selected':''}>Share loss high to low</option>
          <option value="votes_desc" ${sortKey==='votes_desc'?'selected':''}>Vote gain high to low</option>
          <option value="votes_asc" ${sortKey==='votes_asc'?'selected':''}>Vote loss high to low</option>
          <option value="share_desc" ${sortKey==='share_desc'?'selected':''}>2026 ${allianceLabel}% high to low</option>
          <option value="votes_2026_desc" ${sortKey==='votes_2026_desc'?'selected':''}>2026 ${allianceLabel} votes high to low</option>
          <option value="number" ${sortKey==='number'?'selected':''}>Constituency number</option>
        </select>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px">
      <div class="score-box"><div class="score-big" style="color:${allianceColor}">${rows.length}</div><div class="score-lbl">Seats compared</div></div>
      <div class="score-box"><div class="score-big" style="font-size:26px;color:${deltaColor(avgPctChange)}">${pctDelta(avgPctChange)}</div><div class="score-lbl">Avg ${allianceLabel} share change</div></div>
      <div class="score-box"><div class="score-big" style="font-size:26px;color:${deltaColor(totalVoteChange)}">${voteDelta(totalVoteChange)}</div><div class="score-lbl">Total ${allianceLabel} vote change</div></div>
      <div class="score-box"><div class="score-big" style="font-size:26px;color:${allianceColor}">${gained} / ${lost}</div><div class="score-lbl">Share gain / loss seats</div></div>
    </div>
    <p style="font-size:11px;color:var(--muted)">Vote share uses LDF + UDF + NDA alliance totals for each year. Final 2026 values come from ECI round totals.</p>
  </div>`;

  html += `<div class="card"><div class="card-title">${allianceLabel} — all 140 seats sorted by selected metric</div>
    <div style="overflow-x:auto"><table class="results-table"><thead><tr>
      <th>#</th><th>Constituency</th><th>${allianceLabel} candidate</th>
      <th style="text-align:right">${YEAR_LABELS[baseYear]||baseYear} votes</th><th style="text-align:right">2026 votes</th><th style="text-align:right">Vote change</th>
      <th style="min-width:220px">${allianceLabel} share change</th><th style="text-align:right">${YEAR_LABELS[baseYear]||baseYear}%</th><th style="text-align:right">2026%</th><th>Winner</th>
    </tr></thead><tbody>`;

  rows.forEach(r => {
    const barW = Math.max(4, Math.abs(r.pctChange || 0) / maxAbsPct * 100);
    const positive = (r.pctChange || 0) >= 0;
    html += `<tr onclick="openConst(${r.no})" style="cursor:pointer">
      <td style="font-family:var(--mono);color:var(--muted)">${r.no}</td>
      <td style="font-weight:500">${r.name}<br><span style="font-size:10px;color:var(--muted);font-weight:400">${r.district}</span></td>
      <td style="font-size:12px;font-weight:500">${r.candName}<br><span style="font-size:10px;color:var(--muted);font-weight:400">2026 ${r.candParty || '-'} — ${YEAR_LABELS[baseYear]||baseYear} ${r.baseParty || '-'}</span></td>
      <td style="font-family:var(--mono);text-align:right;color:var(--muted)">${r.votesBase.toLocaleString()}</td>
      <td style="font-family:var(--mono);text-align:right;font-weight:600;color:${allianceColor}">${r.votes26.toLocaleString()}</td>
      <td style="font-family:var(--mono);text-align:right;font-weight:600;color:${deltaColor(r.voteChange)}">${voteDelta(r.voteChange)}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="bar-track" style="height:12px;min-width:150px"><div class="bar-fill" style="width:${barW.toFixed(1)}%;background:${positive ? '#16a34a' : '#dc2626'}"></div></div><span style="font-family:var(--mono);font-weight:600;color:${deltaColor(r.pctChange)}">${pctDelta(r.pctChange)}</span></div></td>
      <td style="font-family:var(--mono);text-align:right;color:var(--muted)">${r.pctBase != null ? r.pctBase.toFixed(1)+'%' : '-'}</td>
      <td style="font-family:var(--mono);text-align:right;font-weight:600">${r.pct26 != null ? r.pct26.toFixed(1)+'%' : '-'}</td>
      <td><span class="tag badge-${r.winnerAlliance}">${ALLIANCE_LABELS[r.winnerAlliance] || r.winnerAlliance}</span> <span style="font-size:11px">${cleanName(r.winnerName)}</span></td>
    </tr>`;
  });
  html += `</tbody></table></div></div>`;
  document.getElementById('contentArea').innerHTML = html;
}

//  NDA 20%+ tab - statewide seats filtered by 2026 NDA vote share
function renderNdaTwentyPlus() {
  const preds = eciPredRaw?.predictions || {};
  const threshold = state.ndaThreshold || 20;

  function pct(part, total) {
    return total > 0 ? part / total * 100 : null;
  }
  function refPct(c, year) {
    const key = year === 2016 ? 'actual2016' : 'actual2021';
    const ldf = c.candidates.find(x => x.alliance === 'ldf')?.[key] || 0;
    const udf = c.candidates.find(x => x.alliance === 'udf')?.[key] || 0;
    const nda = c.candidates.find(x => x.alliance === 'nda')?.[key] || 0;
    return pct(nda, ldf + udf + nda);
  }
  function cleanWinnerName(name) {
    return (name || '-').replace(/^(ADV\.|DR\.|ADVOCATE|SHRI|SMT\.)\s*/i, '').trim().split(/\s+/).slice(-2).join(' ');
  }

  const rows = state.constituencies.map(c => {
    const p = preds[String(c.no)];
    const lv = p?.live_votes || {};
    const ldf = lv.ldf || 0, udf = lv.udf || 0, nda = lv.nda || 0;
    const total = ldf + udf + nda;
    const ndaPct = pct(nda, total);
    const ranked = [
      { a: 'ldf', votes: ldf },
      { a: 'udf', votes: udf },
      { a: 'nda', votes: nda },
    ].sort((a, b) => b.votes - a.votes);
    const ref2016 = refPct(c, 2016);
    const ref2021 = refPct(c, 2021);
    return {
      no: c.no, name: c.name, district: c.district,
      ndaName: c.candidates.find(x => x.alliance === 'nda')?.name || '',
      ndaParty: c.candidates.find(x => x.alliance === 'nda')?.party || '',
      nda, total, ndaPct,
      winnerAlliance: p?.called_winner_alliance || p?.winner_alliance || ranked[0]?.a,
      winnerName: p?.called_winner_name || p?.winner_name || ALLIANCE_LABELS[ranked[0]?.a],
      secondAlliance: ranked[1]?.a || 'other',
      secondVotes: ranked[1]?.votes || 0,
      change2016: ref2016 != null && ndaPct != null ? ndaPct - ref2016 : null,
      change2021: ref2021 != null && ndaPct != null ? ndaPct - ref2021 : null,
      hasData: total > 0 && ndaPct != null,
    };
  }).filter(r => r.hasData && r.ndaPct >= threshold)
    .sort((a, b) => b.ndaPct - a.ndaPct);

  const avgVal = key => rows.length ? rows.reduce((s, r) => s + (r[key] ?? 0), 0) / rows.length : null;
  const avgKnown = key => {
    const known = rows.filter(r => r[key] != null);
    return known.length ? known.reduce((s, r) => s + r[key], 0) / known.length : null;
  };
  const chg = v => v == null ? '-' : `${v >= 0 ? '+' : ''}${v.toFixed(1)} pp`;
  const chgCol = v => v == null ? 'var(--muted)' : v >= 0 ? '#16a34a' : '#dc2626';

  const avgNda = avgVal('ndaPct');
  const avgChange2016 = avgKnown('change2016');
  const avgChange2021 = avgKnown('change2021');

  let html = `<div class="card" style="margin-bottom:14px;border-color:${ALLIANCE_COLORS.nda}44;background:${ALLIANCE_COLORS.nda}08">
    <div style="display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px">
      <div class="card-title" style="margin-bottom:0">NDA vote share seats - 2026 final results</div>
      <div style="display:flex;align-items:center;gap:10px;min-width:300px">
        <span style="font-size:12px;color:var(--muted)">Threshold</span>
        <input type="range" min="20" max="50" step="5" value="${threshold}" oninput="state.ndaThreshold=parseInt(this.value,10);renderNdaTwentyPlus()" style="flex:1;accent-color:${ALLIANCE_COLORS.nda}">
        <span style="font-family:var(--mono);font-weight:600;color:${ALLIANCE_COLORS.nda};min-width:38px">${threshold}%</span>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px">
      <div class="score-box"><div class="score-big" style="color:${ALLIANCE_COLORS.nda}">${rows.length}</div><div class="score-lbl">Seats at/above ${threshold}%</div></div>
      <div class="score-box"><div class="score-big" style="font-size:28px;color:${ALLIANCE_COLORS.nda}">${avgNda != null ? avgNda.toFixed(1)+'%' : '-'}</div><div class="score-lbl">Avg 2026 NDA%</div></div>
      <div class="score-box"><div class="score-big" style="font-size:26px;color:${chgCol(avgChange2016)}">${chg(avgChange2016)}</div><div class="score-lbl">Avg vs 2016</div></div>
      <div class="score-box"><div class="score-big" style="font-size:26px;color:${chgCol(avgChange2021)}">${chg(avgChange2021)}</div><div class="score-lbl">Avg vs 2021</div></div>
    </div>
    <p style="font-size:11px;color:var(--muted)">Sorted high to low by 2026 NDA vote share. Percentages use LDF + UDF + NDA alliance totals.</p>
  </div>`;

  if (!rows.length) {
    html += `<div class="placeholder"><h3>No seats at this threshold</h3><p>Move the slider lower to include more constituencies.</p></div>`;
    document.getElementById('contentArea').innerHTML = html;
    return;
  }

  const maxPct = Math.max(...rows.map(r => r.ndaPct), threshold);
  html += `<div class="card"><div class="card-title">Seats sorted by NDA share</div>
    <div style="overflow-x:auto"><table class="results-table">
      <thead><tr>
        <th>#</th><th>Constituency</th><th>NDA candidate</th>
        <th style="min-width:220px">2026 NDA%</th>
        <th style="text-align:right">NDA votes</th><th>Winner</th><th>Second</th>
        <th style="text-align:right">vs 2021</th><th style="text-align:right">vs 2016</th>
      </tr></thead><tbody>`;

  rows.forEach(r => {
    const barW = Math.max(4, r.ndaPct / maxPct * 100);
    html += `<tr onclick="openConst(${r.no})" style="cursor:pointer">
      <td style="font-family:var(--mono);color:var(--muted)">${r.no}</td>
      <td style="font-weight:500">${r.name}<br><span style="font-size:10px;color:var(--muted);font-weight:400">${r.district}</span></td>
      <td style="font-size:12px;font-weight:500">${r.ndaName}<br><span style="font-size:10px;color:var(--muted);font-weight:400">${r.ndaParty}</span></td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="bar-track" style="height:12px;min-width:150px"><div class="bar-fill" style="width:${barW.toFixed(1)}%;background:${ALLIANCE_COLORS.nda}"></div></div><span style="font-family:var(--mono);font-weight:600;color:${ALLIANCE_COLORS.nda}">${r.ndaPct.toFixed(1)}%</span></div></td>
      <td style="font-family:var(--mono);text-align:right">${r.nda.toLocaleString()}</td>
      <td><span class="tag badge-${r.winnerAlliance}">${ALLIANCE_LABELS[r.winnerAlliance] || r.winnerAlliance}</span> <span style="font-size:11px">${cleanWinnerName(r.winnerName)}</span></td>
      <td><span class="tag badge-${r.secondAlliance}">${ALLIANCE_LABELS[r.secondAlliance] || r.secondAlliance}</span> <span style="font-family:var(--mono);font-size:11px;color:var(--muted)">${r.secondVotes.toLocaleString()}</span></td>
      <td style="font-family:var(--mono);text-align:right;font-weight:600;color:${chgCol(r.change2021)}">${chg(r.change2021)}</td>
      <td style="font-family:var(--mono);text-align:right;font-weight:600;color:${chgCol(r.change2016)}">${chg(r.change2016)}</td>
    </tr>`;
  });
  html += `</tbody></table></div></div>`;
  document.getElementById('contentArea').innerHTML = html;
}

//  NDA Allied tab (BDJS / TTP seats) - final vote counts 
function renderNdaAllied() {
  const baselineYear = state.ndaAlliedYear || 2021;
  const actualKey = baselineYear === 2016 ? 'actual2016' : 'actual2021';
  const partyKey = baselineYear === 2016 ? 'party2016' : 'party2021';

  function isAllied(party) {
    const p = (party || '').toUpperCase().trim();
    return p === 'BDJS' || p === 'TTP' || p.includes('TWENTY');
  }
  function partyLabel(party) {
    const p = (party || '').toUpperCase().trim();
    if (p === 'BDJS') return 'BDJS';
    if (p === 'TTP' || p.includes('TWENTY')) return 'TTP';
    return p;
  }

  const allRows = [];
  state.constituencies.forEach(c => {
    const ndaCand = c.candidates.find(ca => ca.alliance === 'nda');
    if (!ndaCand || !isAllied(ndaCand.party)) return;

    const ldfCand = c.candidates.find(ca => ca.alliance === 'ldf');
    const udfCand = c.candidates.find(ca => ca.alliance === 'udf');

    // Historical baseline vote counts
    const ndaBase = ndaCand[actualKey] || 0;
    const ldfBase = ldfCand?.[actualKey] || 0;
    const udfBase = udfCand?.[actualKey] || 0;
    const totBase = ldfBase + udfBase + ndaBase;
    const ndaBasePct = totBase > 0 ? ndaBase / totBase * 100 : null;

    // 2026 final vote counts from ECI
    const pred = eciPredRaw?.predictions?.[String(c.no)];
    let ldf26 = 0, udf26 = 0, nda26 = 0;
    let winnerAlliance = null, winnerName = null, winnerParty = null, margin = null;

    if (pred) {
      const lv = pred.live_votes || {};
      ldf26 = lv.ldf || 0;
      udf26 = lv.udf || 0;
      nda26 = lv.nda || 0;
      winnerAlliance = pred.winner_alliance;
      winnerName = pred.winner_name || '';
      winnerParty = pred.winner_party || '';
      margin = pred.margin || 0;
    }

    const tot26 = ldf26 + udf26 + nda26;
    const nda26Pct = tot26 > 0 ? nda26 / tot26 * 100 : null;
    const change = (ndaBasePct != null && nda26Pct != null) ? nda26Pct - ndaBasePct : null;

    allRows.push({
      no: c.no, name: c.name, district: c.district,
      party: partyLabel(ndaCand.party),
      ndaName: ndaCand.name || '-',
      baselineYear,
      baseParty: ndaCand[partyKey] || ndaCand.party || '',
      ldfBase, udfBase, ndaBase, totBase, ndaBasePct,
      ldf26, udf26, nda26, tot26, nda26Pct, change,
      winnerAlliance, winnerName, winnerParty, margin,
      hasData: tot26 > 0,
    });
  });

  if (allRows.length === 0) {
    document.getElementById('contentArea').innerHTML = `
      <div class="placeholder">
        <h3>No BDJS / Twenty20 seats found</h3>
        <p>Candidate data may not be loaded. Check that candidates_2026.json is populated.</p>
      </div>`;
    return;
  }

  function avg(rows, key) {
    const v = rows.filter(r => r[key] != null);
    return v.length ? v.reduce((s, r) => s + r[key], 0) / v.length : null;
  }

  const byParty = {
    BDJS: allRows.filter(r => r.party === 'BDJS'),
    TTP:  allRows.filter(r => r.party === 'TTP'),
  };

  function renderGroup(partyKey, fullName) {
    const rows = byParty[partyKey];
    if (!rows?.length) return '';

    // Sort by change ascending (biggest drop first); no-data seats at end
    const sorted = [...rows].sort((a, b) => {
      if (!a.hasData && !b.hasData) return a.no - b.no;
      if (!a.hasData) return 1;
      if (!b.hasData) return -1;
      return (a.change ?? 0) - (b.change ?? 0);
    });

    const withData = sorted.filter(r => r.hasData);
    const avgBase = avg(withData, 'ndaBasePct');
    const avg26 = avg(withData, 'nda26Pct');
    const avgChg = avgBase != null && avg26 != null ? avg26 - avgBase : null;
    const ndaWins = sorted.filter(r => r.winnerAlliance === 'nda').length;
    const ldfWins = sorted.filter(r => r.winnerAlliance === 'ldf').length;
    const udfWins = sorted.filter(r => r.winnerAlliance === 'udf').length;

    let g = `<div class="card" style="margin-bottom:14px">
      <div class="card-title">${partyKey} - ${fullName}  -  ${rows.length} seats</div>
      <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:12px;font-size:13px">
        <div><span style="color:var(--muted)">Winners: </span>
          <strong style="color:${ALLIANCE_COLORS.ldf}">LDF ${ldfWins}</strong> &nbsp;
          <strong style="color:${ALLIANCE_COLORS.udf}">UDF ${udfWins}</strong> &nbsp;
          <strong style="color:${ALLIANCE_COLORS.nda}">NDA ${ndaWins}</strong>
        </div>
        ${avgChg != null ? `<div><span style="color:var(--muted)">Avg NDA vote delta:</span>
          <strong style="color:${avgChg >= 0 ? '#16a34a' : '#dc2626'}">&nbsp;${avgChg >= 0 ? '+' : ''}${avgChg.toFixed(1)} pp</strong>
          <span style="color:var(--muted);font-size:11px"> (${withData.length} seats)</span></div>` : ''}
      </div>
      <div style="overflow-x:auto"><table class="results-table">
        <thead><tr>
          <th>#</th><th>Constituency</th><th>NDA Candidate</th>
          <th style="text-align:right">${baselineYear} NDA votes</th>
          <th style="text-align:right">${baselineYear} NDA%</th>
          <th style="text-align:right">2026 NDA votes</th>
          <th style="text-align:right">2026 NDA%</th>
          <th style="text-align:right">Change</th>
          <th>Winner</th><th>Alliance  -  Margin</th>
        </tr></thead><tbody>`;

    sorted.forEach(r => {
      const chgStr = r.change != null
        ? (r.change >= 0 ? `+${r.change.toFixed(1)}` : r.change.toFixed(1)) + ' pp'
        : '-';
      const chgCol = r.change == null ? 'var(--muted)'
        : r.change >= 0 ? '#16a34a' : '#dc2626';
      const wa = r.winnerAlliance;
      const wName = r.winnerName
        ? r.winnerName.replace(/^(ADV\.|DR\.|ADVOCATE|SHRI|SMT\.)\s*/i, '').trim()
            .split(/\s+/).slice(-2).join(' ')
        : '-';
      const wPartyShort = (r.winnerParty || '')
        .replace('Indian National Congress','INC')
        .replace('Communist Party of India (Marxist)','CPI(M)')
        .replace('Communist Party of India','CPI')
        .replace('Indian Union Muslim League','IUML')
        .replace('Bharatiya Janata Party','BJP')
        .replace('Kerala Congress (M)','KC(M)')
        .replace('Kerala Congress','KC');

      g += `<tr onclick="openConst(${r.no})" style="cursor:pointer">
        <td style="font-family:var(--mono);color:var(--muted)">${r.no}</td>
        <td style="font-weight:500">${r.name}</td>
        <td style="font-size:12px;font-weight:500">${r.ndaName}<br><span style="font-size:10px;color:var(--muted);font-weight:400">${baselineYear}: ${r.baseParty || '-'}</span></td>
        <td style="font-family:var(--mono);text-align:right;color:var(--muted)">${r.ndaBase.toLocaleString()}</td>
        <td style="font-family:var(--mono);text-align:right;color:var(--muted)">${r.ndaBasePct != null ? r.ndaBasePct.toFixed(1)+'%' : '-'}</td>
        <td style="font-family:var(--mono);text-align:right;font-weight:500;color:${ALLIANCE_COLORS.nda}">${r.hasData ? r.nda26.toLocaleString() : '-'}</td>
        <td style="font-family:var(--mono);text-align:right">${r.nda26Pct != null ? r.nda26Pct.toFixed(1)+'%' : '-'}</td>
        <td style="font-family:var(--mono);text-align:right;font-weight:600;color:${chgCol}">${chgStr}</td>
        <td style="font-size:12px;font-weight:500;white-space:nowrap">${wName} <span style="font-size:10px;color:var(--muted);font-weight:400">${wPartyShort}</span></td>
        <td style="white-space:nowrap">${wa ? `<span class="tag badge-${wa}">${ALLIANCE_LABELS[wa]||wa}</span>` : '-'} <span style="font-size:10px;color:var(--muted)">${r.margin ? '+'+r.margin.toLocaleString() : ''}</span></td>
      </tr>`;
    });

    if (withData.length > 0) {
      const avgChgStr = avgChg != null ? (avgChg >= 0 ? `+${avgChg.toFixed(1)}` : avgChg.toFixed(1)) + ' pp' : '-';
      const avgChgCol = avgChg == null ? 'var(--muted)' : avgChg >= 0 ? '#16a34a' : '#dc2626';
      const avgNdaBase = avg(withData, 'ndaBase');
      const avgNda26 = avg(withData, 'nda26');
      g += `<tr style="background:var(--surface2);font-weight:600;font-size:12px">
        <td colspan="3" style="color:var(--muted)">Average - ${withData.length} seats</td>
        <td style="font-family:var(--mono);text-align:right;color:var(--muted)">${avgNdaBase != null ? Math.round(avgNdaBase).toLocaleString() : '-'}</td>
        <td style="font-family:var(--mono);text-align:right;color:var(--muted)">${avgBase != null ? avgBase.toFixed(1)+'%' : '-'}</td>
        <td style="font-family:var(--mono);text-align:right;color:${ALLIANCE_COLORS.nda}">${avgNda26 != null ? Math.round(avgNda26).toLocaleString() : '-'}</td>
        <td style="font-family:var(--mono);text-align:right">${avg26 != null ? avg26.toFixed(1)+'%' : '-'}</td>
        <td style="font-family:var(--mono);text-align:right;color:${avgChgCol}">${avgChgStr}</td>
        <td colspan="2"></td>
      </tr>`;
    }

    g += `</tbody></table></div></div>`;
    return g;
  }

  // Overall summary
  const withData = allRows.filter(r => r.hasData);
  const overallAvgBase = avg(withData, 'ndaBasePct');
  const overallAvg26 = avg(withData, 'nda26Pct');
  const overallChg   = overallAvgBase != null && overallAvg26 != null ? overallAvg26 - overallAvgBase : null;
  const totalNdaWins = allRows.filter(r => r.winnerAlliance === 'nda').length;
  const totalLdfWins = allRows.filter(r => r.winnerAlliance === 'ldf').length;
  const totalUdfWins = allRows.filter(r => r.winnerAlliance === 'udf').length;

  let html = `<div class="card" style="margin-bottom:14px;border-color:${ALLIANCE_COLORS.nda}44;background:${ALLIANCE_COLORS.nda}08">
    <div style="display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap">
      <div class="card-title" style="margin-bottom:0">NDA allied seats - BDJS (${byParty.BDJS?.length||0}) + TTP / Twenty20 (${byParty.TTP?.length||0})  -  ${baselineYear} vs 2026</div>
      <div style="display:flex;gap:4px">
        <button class="round-btn ${baselineYear === 2016 ? 'active' : ''}" onclick="state.ndaAlliedYear=2016;renderNdaAllied()">2016</button>
        <button class="round-btn ${baselineYear === 2021 ? 'active' : ''}" onclick="state.ndaAlliedYear=2021;renderNdaAllied()">2021</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px">
      <div class="score-box">
        <div class="score-big" style="color:${ALLIANCE_COLORS.ldf}">${totalLdfWins}</div>
        <div class="score-lbl">LDF won</div>
      </div>
      <div class="score-box">
        <div class="score-big" style="color:${ALLIANCE_COLORS.udf}">${totalUdfWins}</div>
        <div class="score-lbl">UDF won</div>
      </div>
      <div class="score-box">
        <div class="score-big" style="color:${ALLIANCE_COLORS.nda}">${totalNdaWins}</div>
        <div class="score-lbl">NDA won</div>
      </div>
      <div class="score-box">
        <div class="score-big" style="font-size:26px;color:${overallChg == null ? 'var(--muted)' : overallChg >= 0 ? '#16a34a' : '#dc2626'}">
          ${overallChg != null ? (overallChg >= 0 ? '+' : '') + overallChg.toFixed(1) + 'pp' : '-'}
        </div>
        <div class="score-lbl">Avg NDA vote change</div>
      </div>
    </div>
    <p style="font-size:11px;color:var(--muted)">
      Final counts from ECI  -  ${baselineYear}% from official ${baselineYear} results  -  2026% from final ECI vote totals  -  Sorted by largest NDA decline first
    </p>
  </div>`;

  html += renderGroup('BDJS', 'Bharath Dharma Jana Sena');
  html += renderGroup('TTP',  'Twenty20 Party');

  document.getElementById('contentArea').innerHTML = html;
}

init().then(() => fetchECILive());
</script>
