<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kerala Election Live Predictor 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Kerala Election Predictor — Rich Light Theme ───────────────────────── */
:root {
  /* Alliance palette */
  --ldf: #cc0000;  --ldf-light: #fecaca;  --ldf-mid: #ef4444;  --ldf-xlight: #fef2f2;
  --ldf-grad: linear-gradient(135deg, #f87171 0%, #cc0000 100%);
  --udf: #1e40af;  --udf-light: #dbeafe;  --udf-mid: #2563eb;  --udf-xlight: #eff6ff;
  --udf-grad: linear-gradient(135deg, #3b82f6 0%, #1e3a8a 100%);
  --nda: #c2410c;  --nda-light: #fed7aa;  --nda-mid: #f97316;  --nda-xlight: #fff7ed;
  --nda-grad: linear-gradient(135deg, #f97316 0%, #c2410c 100%);
  --ind: #4b5563;  --ind-light: #f3f4f6;  --ind-mid: #6b7280;

  /* Canvas — warm white */
  --bg: #f4f1eb;
  --surface: #ffffff;
  --surface2: #f9f7f3;
  --surface3: #f0ede6;
  --surface4: #e8e3da;

  /* Borders */
  --border: #e5e0d8;  --border-mid: #cfc9be;

  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(60,50,30,.06);
  --shadow: 0 1px 3px rgba(60,50,30,.08), 0 4px 18px rgba(60,50,30,.07);
  --shadow-md: 0 2px 6px rgba(60,50,30,.09), 0 8px 30px rgba(60,50,30,.09);
  --shadow-lg: 0 4px 12px rgba(60,50,30,.10), 0 18px 52px rgba(60,50,30,.11);
  --shadow-inset: inset 0 1px 3px rgba(60,50,30,.07);

  /* Typography */
  --text: #1c1814;  --muted: #72685e;  --muted2: #a89e94;
  --accent: #dc2626;

  /* Geometry */
  --radius: 8px;  --radius-lg: 14px;  --radius-xl: 20px;
  --font: 'Plus Jakarta Sans', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── Custom scrollbars ────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #b0a898; }

/* ── Layout ───────────────────────────────────────────────────────────────── */
.shell { display: grid; grid-template-columns: 272px 1fr; height: 100vh; overflow: hidden; }
.sidebar { background: linear-gradient(180deg, #fdfcfa 0%, #f7f4ee 100%); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.main { display: flex; flex-direction: column; overflow: hidden; }

/* ── Top bar ──────────────────────────────────────────────────────────────── */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 22px;
  height: 58px;
  display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  position: relative;
  box-shadow: 0 1px 0 var(--border), 0 2px 14px rgba(60,50,30,.06);
}
.topbar::after {
  content: '';
  position: absolute;
  left: 0; bottom: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--ldf-mid) 0%, var(--ldf-mid) 33.3%, var(--udf-mid) 33.3%, var(--udf-mid) 66.6%, var(--nda-mid) 66.6%, var(--nda-mid) 100%);
  opacity: .65;
}
.topbar-title {
  font-size: 15px; font-weight: 700;
  letter-spacing: .01em; flex: 1; color: var(--text);
}
.topbar-title span { color: var(--accent); }
.live-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  background: linear-gradient(135deg, #fee2e2, #fecaca);
  color: var(--accent); padding: 4px 10px; border-radius: 100px;
  box-shadow: 0 1px 4px rgba(220,38,38,.18);
}
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
.scoreboard-mini { display: flex; gap: 14px; }
.score-chip { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.score-chip .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.08); }
.score-chip .num { font-family: var(--mono); font-weight: 700; }

/* ── Sidebar head ─────────────────────────────────────────────────────────── */
.sidebar-head { padding: 12px 12px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.dist-select {
  width: 100%; font-size: 13px; font-family: var(--font); font-weight: 500;
  border: 1.5px solid var(--border);
  background: var(--surface) url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%23a89e94'/%3E%3C/svg%3E") no-repeat right 11px center;
  border-radius: 10px; padding: 8px 30px 8px 12px; color: var(--text); appearance: none;
  box-shadow: var(--shadow-inset);
  transition: border-color .15s, box-shadow .15s;
}
.search-box {
  margin-top: 8px; width: 100%; font-size: 13px; font-family: var(--font); font-weight: 500;
  border: 1.5px solid var(--border); border-radius: 10px;
  padding: 8px 10px 8px 34px;
  background: var(--surface) url("data:image/svg+xml,%3Csvg width='13' height='13' viewBox='0 0 13 13' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='5.5' cy='5.5' r='4' stroke='%23a89e94' stroke-width='1.5'/%3E%3Cpath d='M9 9l2.5 2.5' stroke='%23a89e94' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat 11px center;
  color: var(--text); box-shadow: var(--shadow-inset);
  transition: border-color .15s, box-shadow .15s;
}
.dist-select:focus, .search-box:focus {
  outline: none; border-color: var(--udf-mid);
  box-shadow: var(--shadow-inset), 0 0 0 3px rgba(37,99,235,.1);
}

/* ── Constituency list ────────────────────────────────────────────────────── */
.con-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.con-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px 8px 13px; cursor: pointer;
  border-left: 3px solid transparent;
  transition: background .1s, border-color .1s;
}
.con-item:hover { background: #f0ece5; }
.con-item.active { background: var(--udf-xlight); border-left-color: var(--udf-mid); }
.con-item.called-ldf { background: var(--ldf-xlight); border-left-color: var(--ldf-mid); }
.con-item.called-udf { background: var(--udf-xlight); border-left-color: var(--udf-mid); }
.con-item.called-nda { background: var(--nda-xlight); border-left-color: var(--nda-mid); }
.con-item.active.called-ldf { background: var(--ldf-xlight); }
.con-item.active.called-udf { background: #dbeafe; }
.con-item.active.called-nda { background: var(--nda-xlight); }
.con-no { font-family: var(--mono); font-size: 10px; color: var(--muted2); min-width: 22px; }
.con-name { font-size: 13px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.con-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 100px; flex-shrink: 0; letter-spacing: .03em; }
.badge-ldf { background: var(--ldf-light); color: var(--ldf); }
.badge-udf { background: var(--udf-light); color: var(--udf); }
.badge-nda { background: var(--nda-light); color: var(--nda); }
.badge-ind { background: var(--ind-light); color: var(--ind); }
.badge-pending { background: var(--surface3); color: var(--muted2); }
.badge-counting { background: var(--nda-xlight); color: var(--nda); font-weight: 700; }
.badge-ready { background: var(--ldf-xlight); color: var(--ldf); font-weight: 700; }

/* ── Main content ─────────────────────────────────────────────────────────── */
.content { flex: 1; overflow-y: auto; padding: 24px; }
.placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 14px; color: var(--muted); text-align: center; }
.placeholder svg { opacity: .18; }
.placeholder h3 { font-size: 17px; font-weight: 600; color: var(--muted); }
.placeholder p { font-size: 13px; max-width: 270px; line-height: 1.65; }

/* ── Entry header ─────────────────────────────────────────────────────────── */
.entry-header { margin-bottom: 20px; }
.entry-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; color: var(--text); }
.entry-meta { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
.entry-meta span { display: flex; align-items: center; gap: 4px; }

/* ── Cards / Panels ──────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px; margin-bottom: 16px;
  box-shadow: var(--shadow);
  transition: box-shadow .2s, border-color .2s;
}
.card:hover { box-shadow: var(--shadow-md); border-color: var(--border-mid); }
.card-title {
  font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted2); margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.card-title::before {
  content: ''; display: inline-block; width: 3px; height: 13px;
  background: var(--udf-mid); border-radius: 2px; flex-shrink: 0;
}

/* ── Booth controls ───────────────────────────────────────────────────────── */
.booth-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
.field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
.field input[type=number] {
  width: 100%; font-size: 15px; font-family: var(--mono); font-weight: 500;
  border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 8px 11px; background: var(--surface2); color: var(--text);
  box-shadow: var(--shadow-inset);
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus { outline: none; border-color: var(--udf-mid); box-shadow: var(--shadow-inset), 0 0 0 3px rgba(37,99,235,.1); }

/* ── Toggle buttons ───────────────────────────────────────────────────────── */
.round-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.round-btn {
  font-size: 12px; font-family: var(--font); font-weight: 600;
  padding: 5px 13px; border: 1.5px solid var(--border);
  border-radius: 100px; background: var(--surface); cursor: pointer; color: var(--muted);
  transition: all .15s;
  box-shadow: 0 1px 2px rgba(60,50,30,.05);
}
.round-btn:hover { background: var(--surface3); border-color: var(--border-mid); color: var(--text); }
.round-btn.active {
  background: var(--text); color: var(--surface);
  border-color: var(--text);
  box-shadow: 0 2px 6px rgba(28,24,20,.2);
}

/* ── Candidate rows ───────────────────────────────────────────────────────── */
.cand-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; border-radius: var(--radius);
  margin-bottom: 7px; background: var(--surface2);
  border: 1.5px solid var(--border);
  transition: background .12s, border-color .12s, box-shadow .12s;
}
.cand-row:hover { background: #eef3ff; border-color: #c7d7fa; box-shadow: 0 2px 8px rgba(37,99,235,.07); }
.alliance-stripe { width: 4px; height: 38px; border-radius: 3px; flex-shrink: 0; }
.cand-info { flex: 1; min-width: 0; }
.cand-nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cand-party { font-size: 11px; color: var(--muted); margin-top: 2px; }
.cand-votes-inp {
  width: 118px; font-size: 15px; font-family: var(--mono); font-weight: 600;
  border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 7px 11px; background: var(--surface); color: var(--text); text-align: right;
  box-shadow: var(--shadow-inset);
  transition: border-color .15s, box-shadow .15s;
}
.cand-votes-inp:focus { outline: none; border-color: var(--udf-mid); box-shadow: var(--shadow-inset), 0 0 0 3px rgba(37,99,235,.1); }
.cand-pct { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 40px; text-align: right; font-weight: 500; }

/* ── Buttons ──────────────────────────────────────────────────────────────── */
.action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.btn {
  font-family: var(--font); font-size: 13px; font-weight: 600;
  padding: 8px 18px; border-radius: var(--radius); cursor: pointer;
  border: 1.5px solid var(--border); background: var(--surface2); color: var(--text);
  transition: all .15s; letter-spacing: .01em;
  box-shadow: 0 1px 3px rgba(60,50,30,.07);
}
.btn:hover { background: var(--surface3); border-color: var(--border-mid); box-shadow: 0 2px 6px rgba(60,50,30,.1); }
.btn-primary {
  background: linear-gradient(135deg, #1c1814 0%, #2c2520 100%);
  color: #fff; border-color: #1c1814;
  box-shadow: 0 1px 4px rgba(28,24,20,.25), 0 2px 10px rgba(28,24,20,.15);
}
.btn-primary:hover { background: linear-gradient(135deg, #2c2520 0%, #3c3530 100%); }
.btn-success {
  background: var(--ldf-grad); color: #fff; border-color: var(--ldf);
  box-shadow: 0 1px 4px rgba(204,0,0,.3), 0 2px 10px rgba(204,0,0,.15);
}
.btn-success:hover { filter: brightness(1.08); }
.btn-danger { background: #fff0f0; color: var(--accent); border-color: #fca5a5; }
.btn-danger:hover { background: #fee2e2; }

/* ── Prediction card ─────────────────────────────────────────────────────── */
.pred-card { border-radius: var(--radius-xl); overflow: hidden; margin-top: 16px; border: 1.5px solid var(--border); box-shadow: var(--shadow-md); }
.pred-banner { padding: 20px 22px; display: flex; gap: 16px; align-items: center; }
.conf-circle { position: relative; width: 60px; height: 60px; flex-shrink: 0; }
.conf-circle svg { transform: rotate(-90deg); }
.conf-circle .conf-val { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; font-weight: 700; }
.pred-winner-name { font-size: 20px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.pred-meta { font-size: 12px; margin-top: 4px; opacity: .75; }
.pred-margin { font-size: 13px; font-weight: 600; margin-top: 5px; }
.call-indicator {
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 9px; padding: 6px 10px; border-radius: var(--radius);
  font-size: 11px; font-weight: 700; letter-spacing: .02em;
  border: 1.5px solid var(--border);
}
.call-indicator span { font-weight: 500; color: var(--muted); letter-spacing: 0; }
.call-ready { color: var(--ldf); border-color: rgba(204,0,0,.25); background: var(--ldf-xlight); }
.call-called { color: var(--udf); border-color: rgba(37,99,235,.25); background: #eff6ff; }
.call-early { color: var(--nda); border-color: rgba(234,88,12,.28); background: var(--nda-xlight); }
.call-close { color: var(--accent); border-color: rgba(220,38,38,.25); background: #fff0f0; }
.call-watch { color: var(--muted); }
.pred-bars { padding: 16px 22px; border-top: 1px solid var(--border); background: var(--surface); }
.bar-item { margin-bottom: 12px; }
.bar-labels { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
.bar-name { font-weight: 600; }
.bar-votes { font-family: var(--mono); color: var(--muted); }
.bar-track { height: 9px; background: var(--surface2); border-radius: 6px; overflow: hidden; box-shadow: var(--shadow-inset); }
.bar-fill { height: 100%; border-radius: 6px; transition: width .7s cubic-bezier(.4,0,.2,1); }
.actual-row {
  display: flex; gap: 14px; flex-wrap: wrap;
  padding: 11px 22px; background: var(--surface2);
  border-top: 1px solid var(--border); font-size: 11px; color: var(--muted);
}
.actual-row .lbl { font-weight: 700; }

/* ── Round table ──────────────────────────────────────────────────────────── */
.round-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.round-table th { font-weight: 700; color: var(--muted); text-align: left; padding: 7px 10px; border-bottom: 2px solid var(--border); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; background: var(--surface2); }
.round-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); font-family: var(--mono); }
.round-table tr:last-child td { border-bottom: none; }
.round-table tr:hover td { background: #f5f8ff; }
.round-table .r-status-done { color: var(--ldf-mid); font-weight: 700; }
.round-table .r-status-partial { color: var(--nda-mid); font-weight: 700; }
.round-table .r-status-pending { color: var(--muted2); }

/* ── Scoreboard ───────────────────────────────────────────────────────────── */
.score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
.score-box {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px 20px; text-align: center;
  box-shadow: var(--shadow-xs);
  transition: box-shadow .15s, transform .15s, border-color .15s;
  position: relative; overflow: hidden;
}
.score-box::before {
  content: ''; position: absolute; left: 0; top: 0; width: 100%; height: 4px;
  background: currentColor; opacity: .12;
}
.score-box:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.score-big {
  font-size: 44px; font-weight: 700;
  line-height: 1; letter-spacing: -.02em;
}
.score-lbl { font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 6px; letter-spacing: .04em; text-transform: uppercase; }
.majority-line { width: 2px; background: var(--accent); position: absolute; top: 0; bottom: 0; }
.tally-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.tally-name { font-size: 12px; font-weight: 700; min-width: 36px; }
.tally-track { flex: 1; height: 14px; background: var(--surface2); border-radius: 7px; overflow: hidden; position: relative; box-shadow: var(--shadow-inset); }
.tally-fill { height: 100%; border-radius: 7px; transition: width .7s cubic-bezier(.4,0,.2,1); }
.tally-num { font-family: var(--mono); font-size: 14px; font-weight: 700; min-width: 30px; text-align: right; }
.results-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.results-table th { font-weight: 700; color: var(--muted); text-align: left; padding: 8px 9px; border-bottom: 2px solid var(--border); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; background: var(--surface2); }
.results-table td { padding: 8px 9px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.results-table tbody tr:hover td { background: #f5f8ff; }
.results-table tr:last-child td { border-bottom: none; }

/* ── Tabs ─────────────────────────────────────────────────────────────────── */
.tab-bar {
  display: flex; gap: 2px; border-bottom: 2px solid var(--border);
  margin-bottom: 18px; overflow-x: auto; flex-shrink: 0;
  padding: 0 2px;
}
.tab {
  font-size: 13px; font-family: var(--font); font-weight: 500;
  padding: 10px 16px; cursor: pointer;
  color: var(--muted); border-bottom: 2px solid transparent;
  margin-bottom: -2px; background: none;
  border-top: none; border-left: none; border-right: none;
  white-space: nowrap; transition: color .12s, background .12s;
  border-radius: var(--radius) var(--radius) 0 0;
}
.tab:hover { color: var(--text); background: var(--surface3); }
.tab.active { color: var(--udf-mid); border-bottom-color: var(--udf-mid); font-weight: 700; background: var(--udf-xlight); }

/* ── Progress strip ───────────────────────────────────────────────────────── */
.progress-strip { display: flex; gap: 2px; height: 7px; border-radius: 5px; overflow: hidden; margin-top: 10px; box-shadow: var(--shadow-inset); }
.progress-done { background: var(--ldf-grad); }
.progress-counting { background: var(--nda-grad); }
.progress-pending { background: var(--surface3); flex: 1; }

/* ── Round chart ──────────────────────────────────────────────────────────── */
.round-chart-wrap { overflow-x: auto; margin-bottom: 16px; }
.round-chart { display: flex; align-items: flex-end; gap: 3px; height: 96px; padding: 4px 0; }
.round-col { display: flex; flex-direction: column-reverse; align-items: center; gap: 1px; flex-shrink: 0; min-width: 22px; }
.round-bar-seg { width: 100%; border-radius: 2px 2px 0 0; transition: opacity .15s; cursor: default; }
.round-bar-seg:hover { opacity: .72; }
.round-col-lbl { font-size: 9px; color: var(--muted2); font-family: var(--mono); margin-top: 3px; }
.round-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.round-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; }
.round-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* ── Round leads matrix ───────────────────────────────────────────────────── */
.lead-chart { width: 100%; height: 240px; display: block; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-xs); }
.lead-chart text { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.lead-chart-grid { stroke: var(--border); stroke-width: 1; }
.lead-chart-line { fill: none; stroke-width: 2.5; }
.lead-chart-point { stroke: var(--surface); stroke-width: 1.5; }
.lead-summary { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 16px; }
.lead-summary .score-chip { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 14px; box-shadow: var(--shadow-xs); }
.lead-matrix-wrap { overflow: auto; max-height: calc(100vh - 220px); border: 1.5px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-xs); }
.lead-matrix { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
.lead-matrix th, .lead-matrix td { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px 8px; white-space: nowrap; }
.lead-matrix th { position: sticky; top: 0; z-index: 2; background: var(--surface2); color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
.lead-matrix .const-head, .lead-matrix .const-cell { position: sticky; left: 0; z-index: 3; min-width: 210px; max-width: 260px; }
.lead-matrix .const-head { background: var(--surface2); }
.lead-matrix .const-cell { background: var(--surface); cursor: pointer; transition: background .1s; }
.lead-matrix tr:hover .const-cell { background: var(--udf-xlight); }
.lead-cell { min-width: 48px; text-align: center; font-weight: 700; font-family: var(--mono); font-size: 11px; }
.lead-cell.ldf { background: var(--ldf-xlight); color: var(--ldf); }
.lead-cell.udf { background: var(--udf-xlight); color: var(--udf); }
.lead-cell.nda { background: var(--nda-xlight); color: var(--nda); }
.lead-cell.other { background: var(--ind-light); color: var(--ind); }
.lead-cell.empty { background: #fafafa; color: var(--muted2); }
.lead-district { color: var(--muted2); font-size: 10px; margin-left: 4px; }

/* ── Utilities ────────────────────────────────────────────────────────────── */
.tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 100px; letter-spacing: .03em; }
.tag-pdf { background: #dbeafe; color: #1e40af; }
.tag-est { background: #fef9c3; color: #713f12; }
</style>
</head>
<body>
<div class="shell">

<!--  SIDEBAR  -->
<aside class="sidebar">
  <div class="sidebar-head">
    <select class="dist-select" id="distSel" onchange="filterByDistrict(this.value)">
      <option value="">All 14 districts</option>
    </select>
    <input class="search-box" id="searchBox" placeholder="Search constituency..." oninput="filterSearch(this.value)">
  </div>
  <div class="con-list" id="conList"></div>
</aside>

<!--  MAIN  -->
<div class="main">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-title">Kerala Election Live Predictor 2026</div>
    <div class="live-badge"><span class="live-dot"></span>Results</div>
    <div class="scoreboard-mini" id="topScoreboard"></div>
  </header>

  <!-- Tab bar -->
  <div style="padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border);">
    <div class="tab-bar" id="mainTabs">
      <button class="tab active" onclick="switchTab('entry',this)">Vote entry</button>
      <button class="tab" onclick="switchTab('rounds',this)">Rounds</button>
      <button class="tab" onclick="switchTab('round_leads',this)">Round leads</button>
      <button class="tab" onclick="switchTab('scoreboard',this)">Scoreboard</button>
      <button class="tab" onclick="switchTab('ldf_insights',this)">Insights</button>
      <button class="tab" onclick="switchTab('nda_20plus',this)">NDA 20%+</button>
      <button class="tab" onclick="switchTab('nda_allied',this)">NDA Allied (BDJS/TTP)</button>
    </div>
  </div>

  <!-- Content -->
  <div class="content" id="contentArea">
    <div class="placeholder">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <rect x="8" y="12" width="32" height="24" rx="3" stroke="#a89e94" stroke-width="2"/>
        <path d="M16 22h16M16 28h10" stroke="#a89e94" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <h3>Select a constituency</h3>
      <p>Choose any of the 140 Kerala assembly constituencies from the left panel to begin entering vote counts.</p>
    </div>
  </div>

</div>
</div>

<script>
//  State 
const state = {
  constituencies: [],        // full list from API
  constMap: {},              // no -> object
  selected: null,            // currently open const no
  liveData: {},              // no -> { boothsCounted, votes, prediction, status }
  activeTab: 'entry',
  ndaAlliedYear: 2021,
  ndaThreshold: 20,
  insightAlliance: 'ldf',
  ldfInsightYear: 2021,
  ldfInsightSort: 'pct_desc',
  roundLeadsMode: 'cumulative',
  distFilter: '',
  searchFilter: '',
};

const ALLIANCE_COLORS = { ldf:'#cc0000', udf:'#1e40af', nda:'#ea580c', ind:'#4b5563' };
const ALLIANCE_BG     = { ldf:'#fef2f2', udf:'#eff6ff', nda:'#fff7ed', ind:'#f3f4f6' };
const ALLIANCE_LABELS = { ldf:'LDF', udf:'UDF', nda:'BJP', ind:'IND', other:'IND' };

function displayPrediction(no) {
  return state.liveData[no]?.prediction || eciPredRaw?.predictions?.[String(no)] || null;
}

function displayStatus(no) {
  const ld = state.liveData[no];
  if (ld?.status && ld.status !== 'pending') return ld.status;

  const pred = eciPredRaw?.predictions?.[String(no)];
  if (!pred) return ld?.status || 'pending';

  const isDone = pred.is_called
    || pred.call_status === 'called'
    || pred.pct_counted >= 100
    || (pred.tot_rounds && pred.cur_round >= pred.tot_rounds);
  return isDone ? 'called' : 'counting';
}

//  Bootstrap 
async function init() {
  const res = await fetch('/api/constituencies');
  state.constituencies = await res.json();
  state.constituencies.forEach(c => {
    state.constMap[c.no] = c;
    state.liveData[c.no] = { boothsCounted: 0, votes: new Array(c.candidates.length).fill(0), prediction: null, status: 'pending' };
  });
  buildSidebar();
  buildDistDropdown();
  updateTopScoreboard();
}

//  Sidebar 
function buildDistDropdown() {
  const districts = [...new Set(state.constituencies.map(c => c.district))];
  const sel = document.getElementById('distSel');
  districts.forEach(d => {
    const o = document.createElement('option');
    o.value = d; o.textContent = d;
    sel.appendChild(o);
  });
}

function buildSidebar() {
  const list = document.getElementById('conList');
  list.innerHTML = '';
  const q = state.searchFilter.toLowerCase();
  const filtered = state.constituencies.filter(c => {
    if (state.distFilter && c.district !== state.distFilter) return false;
    if (q && !c.name.toLowerCase().includes(q) && !String(c.no).includes(q)) return false;
    return true;
  });
  filtered.forEach(c => {
    const p = displayPrediction(c.no);
    const status = displayStatus(c.no);
    const wa = p?.winner_alliance;
    let badgeCls = 'badge-pending', badgeText = 'pending';
    if (status === 'called') { badgeCls = `badge-${wa||'ind'}`; badgeText = ALLIANCE_LABELS[wa||'ind']; }
    else if (p?.call_ready) { badgeCls = 'badge-ready'; badgeText = 'ready'; }
    else if (status === 'counting') { badgeCls = 'badge-counting'; badgeText = 'partial'; }
    const calledCls = status === 'called' ? `called-${wa}` : '';
    const activeCls = state.selected === c.no ? 'active' : '';
    const div = document.createElement('div');
    div.className = `con-item ${calledCls} ${activeCls}`;
    div.id = `si-${c.no}`;
    div.onclick = () => openConst(c.no);
    div.innerHTML = `<span class="con-no">${c.no}</span>
      <span class="con-name">${c.name}</span>
      <span class="con-badge ${badgeCls}">${badgeText}</span>`;
    list.appendChild(div);
  });
}

function filterByDistrict(d) { state.distFilter = d; buildSidebar(); }
function filterSearch(q) { state.searchFilter = q; buildSidebar(); }

function refreshSidebarItem(no) {
  const el = document.getElementById(`si-${no}`);
  if (!el) return;
  const p = displayPrediction(no);
  const status = displayStatus(no);
  const wa = p?.winner_alliance;
  let badgeCls = 'badge-pending', badgeText = 'pending';
  if (status === 'called') { badgeCls = `badge-${wa||'ind'}`; badgeText = ALLIANCE_LABELS[wa||'ind']; }
  else if (p?.call_ready) { badgeCls = 'badge-ready'; badgeText = 'ready'; }
  else if (status === 'counting') { badgeCls = 'badge-counting'; badgeText = 'partial'; }
  el.className = `con-item ${status==='called'?`called-${wa}`:''} ${state.selected===no?'active':''}`;
  el.innerHTML = `<span class="con-no">${no}</span>
    <span class="con-name">${state.constMap[no].name}</span>
    <span class="con-badge ${badgeCls}">${badgeText}</span>`;
}

//  Open constituency 
function openConst(no) {
  state.selected = no;
  document.querySelectorAll('.con-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`si-${no}`)?.classList.add('active');
  renderCurrentTab();
}

//  Tab switching 
function switchTab(tab, el) {
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderCurrentTab();
}

function renderCurrentTab() {
  if (state.activeTab === 'scoreboard') { renderScoreboard(); return; }
  if (state.activeTab === 'live')       { renderLiveTab();    return; }
  if (state.activeTab === 'ldf_insights') { renderInsights(); return; }
  if (state.activeTab === 'nda_20plus') { renderNdaTwentyPlus(); return; }
  if (state.activeTab === 'nda_allied') { renderNdaAllied();  return; }
  if (state.activeTab === 'round_leads') { renderRoundLeads(); return; }
  if (!state.selected) {
    document.getElementById('contentArea').innerHTML = `<div class="placeholder">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><rect x="8" y="12" width="32" height="24" rx="3" stroke="#a89e94" stroke-width="2"/><path d="M16 22h16M16 28h10" stroke="#a89e94" stroke-width="1.5" stroke-linecap="round"/></svg>
      <h3>Select a constituency</h3><p>Choose any constituency from the left panel to begin.</p></div>`;
    return;
  }
  if (state.activeTab === 'entry') renderEntry();
  else if (state.activeTab === 'rounds') renderRounds();
}

function effectiveTotalRounds(no) {
  const c = state.constMap[no] || {};
  const pred = eciPredRaw?.predictions?.[String(no)] || {};
  const fromRoundRows = c.round_results_rounds || roundCache[no]?.rounds?.length || 0;
  return Math.max(c.total_rounds || 1, pred.tot_rounds || 0, fromRoundRows || 0);
}

function boothsAtRound(no, roundNo) {
  const c = state.constMap[no] || {};
  const totalMain = c.total_main_booths || 0;
  const totalRounds = effectiveTotalRounds(no);
  if (!totalMain || !totalRounds) return roundNo * 14;
  return Math.min(Math.ceil(roundNo * totalMain / totalRounds), totalMain);
}

function roundFromBooths(no, counted) {
  const c = state.constMap[no] || {};
  const totalMain = c.total_main_booths || 0;
  const totalRounds = effectiveTotalRounds(no);
  if (!counted || !totalMain || !totalRounds) return 0;
  return Math.min(Math.ceil(counted / Math.max(1, Math.ceil(totalMain / totalRounds))), totalRounds);
}

//  Entry panel 
function renderEntry() {
  const no = state.selected;
  const c = state.constMap[no];
  const ld = state.liveData[no];
  const totalMain = c.total_main_booths;
  const totalRounds = effectiveTotalRounds(no);
  const boothDerivedRounds = c.booth_derived_rounds || Math.ceil(totalMain / 14);
  const extraRounds = Math.max(totalRounds - boothDerivedRounds, 0);
  const counted = ld.boothsCounted;
  const curRound = ld.currentRound || roundFromBooths(no, counted);

  const vpEntry = votesPollRaw[String(no)] || {};
  const electorate   = vpEntry.electorate    || 0;
  const votesPolled  = vpEntry.votes_polled  || 0;
  const turnoutPct   = vpEntry.turnout_pct   || 0;

  // Vote-based % from ECI prediction (most accurate)
  const eciPredEntry = eciPredRaw?.predictions?.[String(no)];
  const votesCountedEci = eciPredEntry?.votes_counted || 0;
  const votePct = votesPolled > 0 && votesCountedEci > 0
    ? Math.min(Math.round(votesCountedEci / votesPolled * 100), 100)
    : null;

  // Booth-based % fallback
  const boothPct = totalMain > 0 ? Math.round(counted / totalMain * 100) : 0;
  // Use vote-based for the bar when available
  const barPct = votePct !== null ? votePct : boothPct;

  const electorateLine = electorate > 0
    ? `<span>Electorate: ${electorate.toLocaleString()}  -  Turnout: ${turnoutPct}%  -  Polled: ${votesPolled.toLocaleString()}</span>`
    : '';

  let html = `<div class="entry-header">
    <h2>${c.name}</h2>
    <div class="entry-meta">
      <span>${c.district}</span>
      <span>Constituency #${no}</span>
      <span>${c.has_pdf_data ? '<span class="tag tag-pdf">PDF data</span>' : '<span class="tag tag-est">Estimated</span>'}</span>
      <span>${totalMain} main booths  -  ${totalRounds} rounds${extraRounds ? ` (${boothDerivedRounds} booth-derived + ${extraRounds} ECI)` : ''}</span>
      ${electorateLine}
    </div>
  </div>`;

  // Booth count + vote-based progress
  const voteCountLine = votesPolled > 0 && votesCountedEci > 0
    ? `<div style="font-size:12px;color:var(--muted);margin-top:4px;font-family:var(--mono)">${votesCountedEci.toLocaleString()} / ${votesPolled.toLocaleString()} votes  -  <strong>${votePct}%</strong></div>`
    : '';

  html += `<div class="card">
    <div class="card-title">Counting progress</div>
    <div class="booth-grid">
      <div class="field">
        <label>Main booths counted</label>
        <input type="number" id="boothCnt" min="0" max="${totalMain}" value="${counted}"
          oninput="onBoothChange(${no},this.value)">
      </div>
      <div class="field">
        <label>of ${totalMain} main booths  -  Round ${curRound||'-'} of ${totalRounds}</label>
        <div style="font-size:14px;font-weight:500;padding-top:6px;font-family:var(--mono)">${boothPct}% booths counted</div>
        ${voteCountLine}
      </div>
    </div>
    <div class="round-btns">`;
  for (let r = 1; r <= totalRounds; r++) {
    const active = curRound === r ? 'active' : '';
    html += `<button class="round-btn ${active}" onclick="setRound(${no},${r})">R${r}</button>`;
  }
  html += `</div>`;

  // Progress strip - vote-based when available, else booth-based
  html += `<div class="progress-strip" style="margin-top:10px">
    <div class="progress-done" style="flex:${barPct}"></div>
    <div class="progress-pending" style="flex:${100-barPct}"></div>
  </div></div>`;

  // Candidates - pull allied data from ECI prediction if available
  const eciPred = eciPredRaw?.predictions?.[String(no)];
  const alliedMap = {};  // alliance -> {votes, names}
  if (eciPred?.candidates_mapped) {
    for (const [a, cm] of Object.entries(eciPred.candidates_mapped)) {
      if (cm.allied_votes > 0) alliedMap[a] = { votes: cm.allied_votes, names: cm.allied_names || [] };
    }
  }

  html += `<div class="card">
    <div class="card-title">Votes per candidate (running total)</div>`;
  const totalV = ld.votes.reduce((a, b) => a + b, 0);
  c.candidates.forEach((cand, i) => {
    const pctV = totalV > 0 ? Math.round(ld.votes[i] / totalV * 100) : 0;
    const col = ALLIANCE_COLORS[cand.alliance] || '#888';
    const allied = alliedMap[cand.alliance];
    html += `<div class="cand-row">
      <div class="alliance-stripe" style="background:${col}"></div>
      <div class="cand-info">
        <div class="cand-nm">${cand.name}</div>
        <div class="cand-party">${cand.party}  -  <span class="tag badge-${cand.alliance}" style="font-size:9px">${ALLIANCE_LABELS[cand.alliance]||'IND'}</span>
          ${allied ? `<span style="font-size:10px;color:var(--muted);margin-left:4px">+ ${allied.names.join(', ')} (allied)</span>` : ''}
        </div>
      </div>
      <input class="cand-votes-inp" type="number" id="vi_${no}_${i}" min="0"
        value="${ld.votes[i] || ''}" placeholder="0"
        oninput="onVoteChange(${no},${i},this.value)">
      <div class="cand-pct" id="vp_${no}_${i}">${pctV > 0 ? pctV+'%' : ''}</div>
    </div>`;
  });
  html += `</div>`;

  // Actions
  html += `<div class="action-row">
    <button class="btn btn-primary" onclick="runPredict(${no})">Predict winner -></button>
    <button class="btn btn-success" onclick="markCalled(${no})"> Mark as called</button>
    <button class="btn btn-danger" onclick="resetConst(${no})">Reset</button>
  </div>`;

  // Prediction result
  if (ld.prediction) {
    html += renderPrediction(no);
  }

  document.getElementById('contentArea').innerHTML = html;
}

function renderPrediction(no) {
  const c = state.constMap[no];
  const ld = state.liveData[no];
  const p = ld.prediction;
  const cands = c.candidates;
  const wa = p.winner_alliance;
  const winner = cands[p.winner_idx] || cands[0];
  const col = ALLIANCE_COLORS[wa];
  const confColor = p.confidence >= 75 ? '#16a34a' : p.confidence >= 50 ? '#d97706' : '#c94040';
  const projectionMethod = p.formula?.projection_method || '';
  const isFinalCount = projectionMethod === 'final_count';
  const marginLabel = isFinalCount ? 'Margin' : 'Projected margin';
  const methodLabel = isFinalCount ? 'final counted result' : (p.used_pdf_pattern ? 'historical pattern applied' : 'Linear projection');
  const callStatus = p.call_status || (isFinalCount ? 'called' : 'watching');
  const callClass = callStatus === 'called' ? 'call-called'
    : callStatus === 'ready_to_call' ? 'call-ready'
    : callStatus === 'too_early' ? 'call-early'
    : callStatus === 'too_close' ? 'call-close'
    : 'call-watch';
  const callLabel = p.call_label || (isFinalCount ? 'Called' : 'Watching Trend');
  const callConfidence = p.call_confidence || (isFinalCount ? 'Final' : 'Medium');
  const callReason = p.call_reason || '';
  const r = 24, circ = 2 * Math.PI * r;
  const dashArr = (p.confidence / 100) * circ;

  let html = `<div class="pred-card">
    <div class="pred-banner" style="background:${ALLIANCE_BG[wa]}">
      <div class="conf-circle">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="${r}" fill="none" stroke="${col}22" stroke-width="5"/>
          <circle cx="28" cy="28" r="${r}" fill="none" stroke="${col}" stroke-width="5"
            stroke-dasharray="${dashArr.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"/>
        </svg>
        <div class="conf-val" style="color:${col}">${p.confidence}%</div>
      </div>
      <div>
        <div class="pred-winner-name" style="color:${col}">${winner.name}</div>
        <div class="pred-meta">${winner.party}  -  <span class="tag badge-${wa}">${ALLIANCE_LABELS[wa]}</span></div>
        <div class="pred-margin" style="color:${col}">${marginLabel}: <strong>${p.margin.toLocaleString()}</strong> votes</div>
        <div class="pred-meta">${p.pct_counted}% votes counted${p.votes_polled ? ` (${(p.votes_counted||0).toLocaleString()} / ${p.votes_polled.toLocaleString()})` : ''}  -  ${methodLabel}</div>
        <div class="call-indicator ${callClass}">${callLabel} <span>${callConfidence}${callReason ? ` - ${callReason}` : ''}</span></div>
      </div>
    </div>
    <div class="pred-bars">`;

  const sortedIdx = p.projected.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
  const maxProj = p.projected[sortedIdx[0].i];
  // Pull allied info from the raw ECI prediction
  const eciPredForBar = eciPredRaw?.predictions?.[String(no)];
  sortedIdx.forEach(({v, i}) => {
    const cand = cands[i];
    const alliance = ['ldf','udf','nda'][i];
    const cm = eciPredForBar?.candidates_mapped?.[alliance];
    const alliedV = cm?.allied_votes || 0;
    const alliedNm = cm?.allied_names || [];
    const pctS = p.total_projected > 0 ? (v/p.total_projected*100).toFixed(1) : 0;
    const barW = maxProj > 0 ? (v/maxProj*100).toFixed(1) : 0;
    const iw = i === p.winner_idx;
    const alliedNote = alliedV > 0
      ? `<span style="font-size:10px;color:var(--muted)"> incl. ${alliedNm.join(', ')} +${alliedV.toLocaleString()}</span>`
      : '';
    html += `<div class="bar-item">
      <div class="bar-labels">
        <span class="bar-name" style="color:${ALLIANCE_COLORS[cand.alliance]}">${iw?'* ':''}${cand.name} <span style="font-weight:400;color:var(--muted);font-size:11px">${cand.party}</span>${alliedNote}</span>
        <span class="bar-votes">${v.toLocaleString()}  -  ${pctS}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${barW}%;background:${ALLIANCE_COLORS[cand.alliance]}"></div></div>
    </div>`;
  });

  const refRow = (year, actualKey, partyKey) => {
    let row = `<div class="actual-row"><span class="lbl">${year} ref:</span>`;
    let shown = 0;
    cands.forEach(cand => {
      const votes = cand[actualKey] || 0;
      const party = cand[partyKey] || cand.party || '';
      if (votes > 0) {
        row += `<span style="color:${ALLIANCE_COLORS[cand.alliance]}">${party} <strong>${votes.toLocaleString()}</strong></span>`;
        shown++;
      }
    });
    return shown ? row + `</div>` : '';
  };
  const refRows = [
    ['2011',    'actual2011',   'party2011'],
    ['2016',    'actual2016',   'party2016'],
    ['2019 LS', 'actual2019ls', 'party2019ls'],
    ['2021',    'actual2021',   'party2021'],
    ['2024 LS', 'actual2024ls', 'party2024ls'],
  ].map(([label, actualKey, partyKey]) => refRow(label, actualKey, partyKey)).join('');
  html += `</div>${refRows}`;

  //  Formula breakdown 
  const vc  = p.votes_counted || 0;
  const vp  = p.votes_polled  || 0;
  const f   = p.formula       || {};
  const vs  = ld.lastVotes    || ld.votes;   // votes at prediction time
  if (vc > 0 && vp > 0) {
    const pctExact  = (vc / vp * 100).toFixed(2);
    const remaining = vp - vc;

    let formulaHtml = '';
    if (f.projection_method === 'final_count') {
      formulaHtml = `
        <div style="margin-bottom:8px;line-height:1.8;font-size:12px">
          <strong>Counting complete</strong><br>
          The result is using counted ECI totals directly. No historical pattern or linear scaling is applied.
        </div>
        <table style="border-collapse:collapse;width:100%;font-size:11px">
          <thead><tr style="color:var(--muted);background:var(--bg2)">

    html += `<details style="margin:10px 16px 12px;font-size:12px">

//  Rounds tab fallback (no ECI data) 
function renderRoundsFallback() {
  const no = state.selected;
  const c = state.constMap[no];
  const ld = state.liveData[no];
  const counted = ld.boothsCounted;
  const totalMain = c.total_main_booths;
  const totalRounds = effectiveTotalRounds(no);

  let html = `<div class="card">
    <div class="card-title">${c.name} - round breakdown</div>
    <table class="round-table">
      <thead><tr><th>Round</th><th>Main booths</th><th>Aux booths</th><th>Status</th>`;
  c.candidates.forEach(cand => {
    html += `<th style="color:${ALLIANCE_COLORS[cand.alliance]}">${cand.name.split(' ').pop()}</th>`;
  });
  html += `<th>Round total</th></tr></thead><tbody>`;

  for (let r = 1; r <= totalRounds; r++) {
    const bStart = (r-1)*14 + 1;
    const bEnd   = Math.min(r*14, totalMain);
    const done   = bEnd <= counted;
    const partial = bStart <= counted && bEnd > counted;
    const statusCls = done ? 'r-status-done' : partial ? 'r-status-partial' : 'r-status-pending';
    const statusLabel = done ? ' done' : partial ? 'partial' : 'pending pending';
    html += `<tr>
      <td>Round ${r}</td>
      <td>${bStart}-${bEnd}</td>
      <td style="color:var(--muted)">included</td>
      <td class="${statusCls}">${statusLabel}</td>`;
    c.candidates.forEach(() => html += `<td>-</td>`);
    html += `<td>-</td></tr>`;
  }

  html += `</tbody></table>
    <p style="font-size:11px;color:var(--muted);margin-top:10px">
      Each round = 14 main booths. Auxiliary booths (1A, 2A...) counted within their parent round but do not increment the main booth counter.
    </p></div>`;

  document.getElementById('contentArea').innerHTML = html;
}

//  Scoreboard 
function renderScoreboard() {
  const all = state.constituencies;
  const called = all.filter(c => state.liveData[c.no]?.status === 'called');
  const counting = all.filter(c => state.liveData[c.no]?.status === 'counting');
  const tally = { ldf: 0, udf: 0, nda: 0, ind: 0 };
  called.forEach(c => {
    const waRaw = state.liveData[c.no]?.prediction?.called_winner_alliance
      || state.liveData[c.no]?.prediction?.winner_alliance
      || c.winner2021;
    const wa = ['ldf','udf','nda'].includes(waRaw) ? waRaw : 'ind';
    tally[wa] = (tally[wa]||0) + 1;
  });
  const maxT = Math.max(...Object.values(tally), 1);

  let html = `<div class="score-grid">
    <div class="score-box" style="border-color:${ALLIANCE_COLORS.ldf}44">
      <div class="score-big" style="color:${ALLIANCE_COLORS.ldf}">${tally.ldf}</div>
      <div class="score-lbl">LDF seats</div>
    </div>
    <div class="score-box" style="border-color:${ALLIANCE_COLORS.udf}44">

    </div>
    <div class="score-box" style="border-color:${ALLIANCE_COLORS.nda}44">

      <div class="score-lbl">NDA seats</div>

  </div>

  ['ldf','udf','nda'].forEach(a => {

    const maj = (71/140*100).toFixed(1);
    html += `<div class="tally-bar-row">

      <div class="tally-track">

  </div>`;

  if (called.length > 0) {
    html += `<div class="card">
      <div class="card-title">Called results</div>
      <table class="results-table">
        <thead><tr><th>#</th><th>Constituency</th><th>District</th><th>Winner</th><th>Alliance</th><th>Confidence</th></tr></thead>
        <tbody>`;
    called.forEach(c => {
      const ld = state.liveData[c.no];
      const waRaw = ld.prediction?.called_winner_alliance || ld.prediction?.winner_alliance || c.winner2021;
      const wa = ['ldf','udf','nda'].includes(waRaw) ? waRaw : 'ind';
      const wi = ld.prediction?.winner_idx ?? 0;
      const wCand = c.candidates[wi];
      const conf = ld.prediction?.confidence ?? '-';
      const winnerName = ld.prediction?.called_winner_name || wCand?.name || '-';
      html += `<tr>

//  Top scoreboard 
function updateTopScoreboard() {
  const rawTotal = eciPredRaw?.total_active || 0;
  if (rawTotal > 0) {
    const isFinal = (eciPredRaw.called_count || 0) >= rawTotal;
    const rawTally = isFinal
      ? (eciPredRaw.called_tally || eciPredRaw.seat_tally)
      : eciPredRaw.seat_tally;
    if (rawTally) {
      document.getElementById('topScoreboard').innerHTML = ['ldf','udf','nda'].map(a =>
        `<div class="score-chip">
          <div class="dot" style="background:${ALLIANCE_COLORS[a]}"></div>
          <span style="color:${ALLIANCE_COLORS[a]};font-weight:600">${ALLIANCE_LABELS[a]}</span>
          <span class="num">${rawTally[a] || 0}</span>
        </div>`).join('');
      return;
    }
  }

  const tally = { ldf: 0, udf: 0, nda: 0 };
  state.constituencies.forEach(c => {
    if (displayStatus(c.no) === 'called') {
      const pred = displayPrediction(c.no);
      const wa = pred?.called_winner_alliance
        || pred?.winner_alliance
        || c.winner2021;
      if (tally[wa] !== undefined) tally[wa]++;
    }
  });
  document.getElementById('topScoreboard').innerHTML = ['ldf','udf','nda'].map(a =>
    `<div class="score-chip">
      <div class="dot" style="background:${ALLIANCE_COLORS[a]}"></div>
      <span style="color:${ALLIANCE_COLORS[a]};font-weight:600">${ALLIANCE_LABELS[a]}</span>
      <span class="num">${tally[a]}</span>
    </div>`).join('');
}

//  Event handlers 
function onBoothChange(no, val) {
  state.liveData[no].boothsCounted = parseInt(val)||0;
  state.liveData[no].currentRound = null;
  state.liveData[no].status = 'counting';
}

async function setRound(no, r) {
  const c  = state.liveData[no];
  const cm = state.constMap[no];

  // Update booth count
  c.boothsCounted = boothsAtRound(no, r);
  c.currentRound = r;
  c.status = 'counting';
  const boothInput = document.getElementById('boothCnt');
  if (boothInput) boothInput.value = c.boothsCounted;

  // Round button active state
  document.querySelectorAll('.round-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i + 1 === r);
  });

  //  Fill vote inputs from round_results at round r 
  // Fetch round data (uses cache from Rounds tab if already loaded)
  let rd = roundCache[no];
  if (!rd) {
    try {
      const res = await fetch(`/api/round_results/${no}`);
      if (res.ok) { rd = await res.json(); roundCache[no] = rd; }
    } catch (_) {}
  }
  if (!rd || !rd.rounds || !rd.rounds.length) return;

  // Find the round entry (rounds are sorted by round number)
  const roundEntry = rd.rounds.find(rr => rr.round === r) || rd.rounds[r - 1];
  if (!roundEntry) return;
  const cumul = roundEntry.cumulative;

  // Progress strip + vote count line - use vote-based % when available
  const totalCumul = cumul.reduce((a, b) => a + b, 0);
  const vpPoll = votesPollRaw[String(no)]?.votes_polled || 0;
  const boothPctR = cm.total_main_booths > 0 ? Math.round(c.boothsCounted / cm.total_main_booths * 100) : 0;
  const votePctR  = vpPoll > 0 ? Math.min(Math.round(totalCumul / vpPoll * 100), 100) : null;
  const barPctR   = votePctR !== null ? votePctR : boothPctR;

  // Update booth% label
  const roundLabel = document.querySelector('.booth-grid .field:nth-child(2) label');
  if (roundLabel) roundLabel.textContent = `of ${cm.total_main_booths} main booths  Round ${r} of ${effectiveTotalRounds(no)}`;
  const boothLabel = document.querySelector('.booth-grid .field:nth-child(2) div:first-child');
  if (boothLabel) boothLabel.textContent = `${boothPctR}% booths counted`;

  // Update or create vote count line
  const fieldDiv = document.querySelector('.booth-grid .field:nth-child(2)');
  if (fieldDiv) {
    let vLine = fieldDiv.querySelector('.vote-count-line');
    if (vpPoll > 0) {
      if (!vLine) { vLine = document.createElement('div'); vLine.className = 'vote-count-line'; fieldDiv.appendChild(vLine); }
      vLine.style.cssText = 'font-size:12px;color:var(--muted);margin-top:4px;font-family:var(--mono)';
      vLine.innerHTML = `${totalCumul.toLocaleString()} / ${vpPoll.toLocaleString()} votes  -  <strong>${votePctR}%</strong>`;
    }
  }

  const prog = document.querySelector('.progress-strip');
  if (prog) prog.innerHTML =
    `<div class="progress-done" style="flex:${barPctR}"></div><div class="progress-pending" style="flex:${100-barPctR}"></div>`;

  // Map ECI candidate indices -> alliance slot indices
  // Use prediction's candidates_mapped to know which ECI name belongs to which alliance
  const pred = eciPredRaw?.predictions?.[String(no)];
  const alliances = ['ldf', 'udf', 'nda'];

  alliances.forEach((alliance, slotIdx) => {
    const eciName = pred?.candidates_mapped?.[alliance]?.eci_name;
    if (!eciName || eciName === '?') return;

    // Find this candidate's index in round_results.candidates
    // Use exact match first to avoid prefix collisions (e.g. SHANAVAS A A vs SHANAVAS PADHOOR)
    const normStr = s => s.toLowerCase().replace(/[.\s]/g, '');
    const findCandIdx = (name) => {
      const t = normStr(name);
      let i = rd.candidates.findIndex(nm => normStr(nm) === t);
      if (i >= 0) return i;
      i = rd.candidates.findIndex(nm => { const n=normStr(nm); return n.includes(t)||t.includes(n); });
      if (i >= 0) return i;
      return rd.candidates.findIndex(nm => normStr(nm).includes(t.slice(0, 10)));
    };
    const eciIdx = findCandIdx(eciName);
    if (eciIdx < 0 || eciIdx >= cumul.length) return;

    let v = cumul[eciIdx] || 0;

    // Add allied candidate votes at this round too
    const alliedNames = pred?.candidates_mapped?.[alliance]?.allied_names || [];
    alliedNames.forEach(alliedEciName => {
      const alliedIdx = findCandIdx(alliedEciName);
      if (alliedIdx >= 0 && alliedIdx < cumul.length) v += cumul[alliedIdx] || 0;
    });

    // Update state and DOM
    state.liveData[no].votes[slotIdx] = v;
    const inp = document.getElementById(`vi_${no}_${slotIdx}`);
    if (inp) inp.value = v || '';
  });

  // Refresh vote percentages
  const totalV = state.liveData[no].votes.reduce((a, b) => a + b, 0);
  cm.candidates.forEach((_, i) => {
    const el = document.getElementById(`vp_${no}_${i}`);
    if (el) el.textContent = totalV > 0
      ? Math.round(state.liveData[no].votes[i] / totalV * 100) + '%' : '';
  });
}

function onVoteChange(no, idx, val) {
  state.liveData[no].votes[idx] = parseInt(val)||0;
  state.liveData[no].status = 'counting';
  // live pct update
  const totalV = state.liveData[no].votes.reduce((a,b)=>a+b,0);
  state.constMap[no].candidates.forEach((_, i) => {
    const el = document.getElementById(`vp_${no}_${i}`);
    if (el) el.textContent = totalV > 0 ? Math.round(state.liveData[no].votes[i]/totalV*100)+'%' : '';
  });
}

async function runPredict(no) {
  const ld = state.liveData[no];
  const c = state.constMap[no];
  const res = await fetch('/api/predict', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      const_no: no,
      booths_counted: ld.boothsCounted || 14,
      total_main_booths: c.total_main_booths,
      total_rounds: effectiveTotalRounds(no),
      current_round: ld.currentRound || null,
      votes: ld.votes,
    })
  });
  if (!res.ok) { alert('Enter vote counts first.'); return; }
  const pred = await res.json();
  if (pred.error) { alert(pred.error); return; }
  if (!pred.votes_polled && votesPollRaw[String(no)]) {
    pred.votes_polled = votesPollRaw[String(no)].votes_polled;
  }
  ld.prediction = pred;
  ld.lastVotes  = [...ld.votes]; // snapshot of votes at prediction time
  ld.status = 'counting';
  refreshSidebarItem(no);
  renderEntry();
}

function markCalled(no) {
  const ld = state.liveData[no];
  if (!ld.prediction) { runPredict(no).then(() => { ld.status = 'called'; refreshSidebarItem(no); updateTopScoreboard(); renderEntry(); }); return; }
  ld.status = 'called';
  refreshSidebarItem(no);
  updateTopScoreboard();
  renderEntry();
}

function markAllCalled() {
  const preds = eciPredRaw?.predictions || {};
  let count = 0;
  state.constituencies.forEach(c => {
    const ld = state.liveData[c.no];
    const pred = preds[String(c.no)];
    if (!pred) return;
    ld.status = 'called';
    // Ensure prediction is in local state
    if (!ld.prediction) {
      const projected = ['ldf','udf','nda'].map(a => pred.projected?.[a] || 0);
      const winnerIdx = ['ldf','udf','nda'].indexOf(pred.winner_alliance);
      ld.prediction = {
        projected,
        total_projected: projected.reduce((a,b)=>a+b,0),
        winner_idx:      Math.max(winnerIdx, 0),
        winner_alliance: pred.winner_alliance,
        margin:          pred.margin,
        confidence:      pred.confidence,
        call_status:     pred.call_status,
        call_label:      pred.call_label,
        call_confidence: pred.call_confidence,
        call_ready:      pred.call_ready,
        call_reason:     pred.call_reason,
        pct_counted:     pred.pct_counted,
        used_pdf_pattern: false,
        booth_info:      { scaling: 1 },
      };
    }
    refreshSidebarItem(c.no);
    count++;
  });
  updateTopScoreboard();
  renderCurrentTab();
  console.log(`Marked ${count} constituencies as called.`);
}

function resetConst(no) {

}

//  ECI Live Data 
let eciLiveRaw   = {};   // const_no_str -> ECI scraped data
let eciPredRaw   = {};   // from /api/live_predictions (predict_from_eci output)
let votesPollRaw = {};   // const_no_str -> {electorate, votes_polled, turnout_pct, ...}
async function fetchECILive() {
  try {
    const [r1, r2, r3] = await Promise.all([
      fetch('/api/live_results'),
      fetch('/api/live_predictions'),
      fetch('/api/votes_polled'),
    ]);
    if (r1.ok) eciLiveRaw   = await r1.json();
    if (r2.ok) eciPredRaw   = await r2.json();
    if (r3.ok) votesPollRaw = await r3.json();

    const preds = eciPredRaw.predictions || {};
    syncPredictionsToState(preds);
    updateTopScoreboard();
    renderCurrentTab();
  } catch (e) { /* offline — ignore */ }
}

function syncPredictionsToState(preds) {
  // Push ECI predictions into state.liveData so sidebar & scoreboard update
  for (const [cnoStr, p] of Object.entries(preds)) {
    const cno = parseInt(cnoStr);
    const ld  = state.liveData[cno];
    if (!ld) continue;

    const c = state.constMap[cno];
    if (!c) continue;

    // Fill votes in LDF/UDF/NDA order
    const votes = ['ldf','udf','nda'].map(a => p.live_votes?.[a] || 0);
    ld.votes = votes;

    // Estimate booths counted
    const total_main = c.total_main_booths || 200;
    const tot_rounds = Math.max(p.tot_rounds || 0, c.total_rounds || 1);
    c.total_rounds = tot_rounds;
    ld.currentRound = p.cur_round || ld.currentRound || null;
    ld.boothsCounted = boothsAtRound(cno, p.cur_round || 0);

    const isDone = p.is_called || p.pct_counted >= 100 || p.cur_round >= p.tot_rounds;
    if (isDone) ld.status = 'called';
    else if (ld.status === 'pending') ld.status = 'counting';

    // Inject prediction in app format
    const projected = ['ldf','udf','nda'].map(a => p.projected?.[a] || 0);
    const winnerIdx = ['ldf','udf','nda'].indexOf(p.winner_alliance);
    ld.prediction = {
      projected,
      total_projected: projected.reduce((a,b)=>a+b,0),
      winner_idx:      Math.max(winnerIdx, 0),
      winner_alliance: p.winner_alliance,
      margin:          p.margin,
      confidence:      p.confidence,
      call_status:     p.call_status,
      call_label:      p.call_label,
      call_confidence: p.call_confidence,
      call_ready:      p.call_ready,
      call_reason:     p.call_reason,
      pct_counted:     p.pct_counted,
      votes_counted:   p.votes_counted,
      votes_polled:    p.votes_polled || votesPollRaw[String(cno)]?.votes_polled,
      used_pdf_pattern: p.used_pattern,
      formula:         p.formula || {},
      booth_info:      { scaling: 1 },
      eci_names:       ['ldf','udf','nda'].map(a => p.candidates_mapped?.[a]?.eci_name || ''),
    };

    refreshSidebarItem(cno);
  }
}

function normalizeName(s) {
  return (s||'').toLowerCase().replace(/[.\s]/g,'');
}

function matchECICandsToApp(eciCands, appCands) {
  return appCands.map(ac => {
    const anNorm = normalizeName(ac.name);
    const apNorm = normalizeName(ac.party);
    let best = -1, bestScore = 0;
    eciCands.forEach((ec, j) => {
      const enNorm = normalizeName(ec.name);
      const epNorm = normalizeName(ec.party);
      let score = 0;
      const aLast = anNorm.slice(-5);
      const eLast = enNorm.slice(-5);
      if (aLast && eLast && aLast === eLast) score += 6;
      if (apNorm && epNorm && (apNorm.slice(0,4) === epNorm.slice(0,4))) score += 4;
      if (score > bestScore) { bestScore = score; best = j; }
    });
    return best;
  });
}

//  Round results cache 
const roundCache = {};
let roundLeadsCache = null;

//  Rounds tab - fetches per-round data from /api/round_results 
async function renderRounds() {
  const no = state.selected;
  const c  = state.constMap[no];
  const area = document.getElementById('contentArea');

  // Show loading state immediately
  area.innerHTML = `<div class="card"><div class="card-title">${c.name} - Round-wise votes</div>
    <p style="color:var(--muted);font-size:13px">Loading round data...</p></div>`;

  // Fetch (or use cache)
  let rd = roundCache[no];
  if (!rd) {
    try {
      const res = await fetch(`/api/round_results/${no}`);
      if (!res.ok) { renderRoundsFallback(); return; }
      rd = await res.json();
      roundCache[no] = rd;
    } catch (e) {
      renderRoundsFallback();
      return;
    }
  }

  const candidates = rd.candidates || [];
  const parties    = rd.parties    || [];
  const rounds     = rd.rounds     || [];
  const totals     = rd.total      || [];
  const n          = candidates.length;

  if (!rounds.length) { renderRoundsFallback(); return; }

  //  Assign colors per candidate 
  // Try to match to app alliance; fallback to a distinct palette
  const PALETTE = ['#1a4d8c','#0f766e','#9a3412','#7c3aed','#2d6a4f','#b45309','#be123c','#1d4ed8','#991b1b','#6d28d9'];
  const appCands = c.candidates || [];

  function candColor(ci) {
    // Try to match by name fragment
    const ecName = candidates[ci].toLowerCase();
    for (const ac of appCands) {
      const acWords = ac.name.toLowerCase().split(' ').filter(w => w.length > 3);
      if (acWords.some(w => ecName.includes(w))) {
        return ALLIANCE_COLORS[ac.alliance] || PALETTE[ci % PALETTE.length];
      }
    }
    return PALETTE[ci % PALETTE.length];
  }

  const colors = candidates.map((_, ci) => candColor(ci));

  //  Build stacked bar chart 
  const maxRoundTotal = Math.max(...rounds.map(r => r.increment.reduce((a,b)=>a+b,0)), 1);

  let chartHtml = `<div class="round-legend">`;
  candidates.forEach((nm, ci) => {
    const label = nm.split(' ').slice(-2).join(' '); // last 2 words
    chartHtml += `<span class="round-legend-item">
      <span class="round-legend-dot" style="background:${colors[ci]}"></span>
      <span>${label}</span>
      <span style="color:var(--muted);font-size:11px">${parties[ci] || ''}</span>
    </span>`;
  });
  chartHtml += `</div><div class="round-chart-wrap"><div class="round-chart">`;

  rounds.forEach(rr => {
    const inc   = rr.increment;
    const total = inc.reduce((a, b) => a + b, 0);
    const scale = total > 0 ? (total / maxRoundTotal) : 0;
    const barH  = Math.round(scale * 76);  // max 76px

    chartHtml += `<div class="round-col" title="R${rr.round}: ${inc.map((v,ci)=>candidates[ci].split(' ').pop()+' '+v.toLocaleString()).join(' | ')}">`;
    // Stack segments bottom-to-top (column-reverse in CSS handles visual order)
    candidates.forEach((_, ci) => {
      const segH = total > 0 ? Math.round(inc[ci] / total * barH) : 0;
      if (segH > 0) {
        chartHtml += `<div class="round-bar-seg" style="height:${segH}px;background:${colors[ci]}"></div>`;
      }
    });
    chartHtml += `<span class="round-col-lbl">R${rr.round}</span></div>`;
  });

  chartHtml += `</div></div>`;

  //  Build round-by-round table 
  const has2021 = rounds.length && rounds[0].share_2021 !== undefined;

  let tableHtml = `<div style="overflow-x:auto"><table class="round-table">
    <thead><tr>
      <th>Round</th>`;

  // Top-3 candidates by total vote (show top 3 + "others" to keep table readable)
  const TOP = 4;
  const sortedIdx = [...Array(n).keys()].sort((a, b) => (totals[b]||0) - (totals[a]||0));
  const showIdx   = sortedIdx.slice(0, TOP);
  const hasOthers = n > TOP;

  showIdx.forEach(ci => {
    const shortName = candidates[ci].split(' ').slice(-2).join(' ');
    tableHtml += `<th style="color:${colors[ci]}">${shortName}<br>
      <span style="font-weight:400;color:var(--muted);font-size:10px">${parties[ci]||''}</span></th>`;
  });
  if (hasOthers) tableHtml += `<th>Others</th>`;
  tableHtml += `<th>Round total</th><th>Leader (cumul.)</th>`;

  // 2021 comparison columns
  if (has2021) {
    tableHtml += `
      <th style="color:var(--ldf);border-left:2px solid var(--border)">LDF<br>
        <span style="font-weight:400;color:var(--muted);font-size:10px">26% / 21% / delta</span></th>
      <th style="color:var(--udf)">UDF<br>
        <span style="font-weight:400;color:var(--muted);font-size:10px">26% / 21% / delta</span></th>
      <th style="color:var(--nda)">NDA<br>
        <span style="font-weight:400;color:var(--muted);font-size:10px">26% / 21% / delta</span></th>`;
  }
  tableHtml += `</tr></thead><tbody>`;

  const cumul = new Array(n).fill(0);

  rounds.forEach(rr => {
    const inc = rr.increment.length === n ? rr.increment : new Array(n).fill(0);
    inc.forEach((v, ci) => { cumul[ci] += v; });

    const roundTotal = inc.reduce((a, b) => a + b, 0);
    const othersInc  = hasOthers ? sortedIdx.slice(TOP).reduce((s, ci) => s + (inc[ci]||0), 0) : 0;

    const leadCi  = cumul.indexOf(Math.max(...cumul));
    const sorted2 = [...cumul].sort((a,b) => b-a);
    const margin  = sorted2[0] - (sorted2[1]||0);

    tableHtml += `<tr>
      <td style="color:var(--muted)">R${rr.round}<br><span style="font-size:10px">${rr.pct != null ? rr.pct+'%' : ''}</span></td>`;

    showIdx.forEach(ci => {
      const v = inc[ci] || 0;
      const isLead = cumul.indexOf(Math.max(...cumul)) === ci;
      tableHtml += `<td style="${isLead ? `font-weight:600;color:${colors[ci]}` : ''}">${v > 0 ? v.toLocaleString() : '-'}</td>`;
    });

    if (hasOthers) tableHtml += `<td style="color:var(--muted)">${othersInc > 0 ? othersInc.toLocaleString() : '-'}</td>`;

    tableHtml += `<td style="font-weight:500">${roundTotal > 0 ? roundTotal.toLocaleString() : '-'}</td>
      <td style="color:${colors[leadCi]};font-weight:500">
        ${candidates[leadCi].split(' ').pop()} +${margin.toLocaleString()}
      </td>`;

    // 2021 comparison cells
    if (has2021 && rr.share_2021) {
      ['ldf', 'udf', 'nda'].forEach((a, ai) => {
        const s26  = rr.share_2026?.[a] ?? '-';
        const s21  = rr.share_2021[a] ?? '-';
        const d    = rr.delta?.[a];
        const dStr = d != null ? (d >= 0 ? `+${d}` : `${d}`) : '';
        const dCol = d == null ? '' : (d > 0 ? '#16a34a' : d < 0 ? '#dc2626' : 'var(--muted)');
        const border = ai === 0 ? 'border-left:2px solid var(--border);' : '';
        tableHtml += `<td style="${border}font-size:12px;white-space:nowrap">
          <span style="font-weight:600">${s26}%</span>
          <span style="color:var(--muted)"> / ${s21}%</span>
          ${dStr ? `<span style="color:${dCol};font-weight:600"> ${dStr}</span>` : ''}
        </td>`;
      });
    }

    tableHtml += `</tr>`;
  });

  // Totals row
  tableHtml += `<tr style="background:var(--surface2);font-weight:600"><td>Total</td>`;
  showIdx.forEach(ci => {
    tableHtml += `<td>${(totals[ci]||0).toLocaleString()}</td>`;
  });
  if (hasOthers) {
    const othersTotal = sortedIdx.slice(TOP).reduce((s, ci) => s + (totals[ci]||0), 0);
    tableHtml += `<td>${othersTotal.toLocaleString()}</td>`;
  }
  const grandTotal  = totals.reduce((a, b) => a + b, 0);
  const finalLeadCi = totals.indexOf(Math.max(...totals));
  const finalSorted = [...totals].sort((a,b)=>b-a);

  // Final 2021 comparison (full result)
  const lastRound = rounds[rounds.length - 1];
  tableHtml += `<td>${grandTotal.toLocaleString()}</td>
    <td style="color:${colors[finalLeadCi]};font-weight:600">
      ${candidates[finalLeadCi].split(' ').pop()} +${(finalSorted[0]-(finalSorted[1]||0)).toLocaleString()}
    </td>`;
  if (has2021 && lastRound?.share_2021) {
    ['ldf', 'udf', 'nda'].forEach((a, ai) => {
      const s26 = lastRound.share_2026?.[a] ?? '-';
      const s21 = lastRound.share_2021[a] ?? '-';
      const d   = lastRound.delta?.[a];
      const dStr = d != null ? (d >= 0 ? `+${d}` : `${d}`) : '';
      const dCol = d == null ? '' : (d > 0 ? '#16a34a' : d < 0 ? '#dc2626' : 'var(--muted)');
      const border = ai === 0 ? 'border-left:2px solid var(--border);' : '';
      tableHtml += `<td style="${border}font-size:12px;white-space:nowrap">
        <span style="font-weight:600">${s26}%</span>
        <span style="color:var(--muted)"> / ${s21}%</span>
        ${dStr ? `<span style="color:${dCol};font-weight:600"> ${dStr}</span>` : ''}
      </td>`;
    });
  }
  tableHtml += `</tr></tbody></table></div>`;

  const fetchedAt = rd.fetched_at ? new Date(rd.fetched_at).toLocaleString() : 'cached';

  area.innerHTML = `<div class="card">
    <div class="card-title">${c.name} - Round-wise ECI vote data</div>
    <p style="font-size:11px;color:var(--muted);margin-bottom:12px">
      ${rounds.length} rounds  -  ${n} candidates  -  Source: results.eci.gov.in  -  ${fetchedAt}
    </p>
    ${chartHtml}
    ${tableHtml}
  </div>`;
}
